<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>إدارة حضرم شوب</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--a1:#a8621a;--deep:#3b2410;--cream:#fbf1e1;--line:#eadfce;--red:#d93a30;--ok:#1f9d55}
*{box-sizing:border-box}
body{margin:0;background:#faf6ef;font-family:Cairo,system-ui,sans-serif;color:#2a1a0c;padding-bottom:40px}
header{background:var(--deep);color:#fff;padding:14px 16px;font-weight:900;font-size:18px;display:flex;justify-content:space-between;align-items:center}
.wrap{max-width:720px;margin:0 auto;padding:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 3px 12px rgba(59,36,16,.07)}
h3{margin:0 0 10px;font-size:16px}
label{display:block;font-weight:700;font-size:13px;margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;font-size:15px;padding:10px;border:1px solid var(--line);border-radius:12px;background:#fff}
textarea{min-height:80px}
button{font-family:inherit;font-weight:800;border:0;border-radius:12px;padding:11px 16px;font-size:15px;cursor:pointer}
.pri{background:var(--a1);color:#fff}.sec{background:var(--cream);color:var(--deep)}.del{background:#fde8e6;color:var(--red)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.row>*{flex:1}
.item{display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:10px 0}
.item img{width:58px;height:58px;border-radius:10px;object-fit:cover;background:#f3ece0}
.item .t{flex:1;font-weight:700;font-size:14px;line-height:1.4}
.item small{color:#80705f;display:block}
.item button{padding:8px 12px;font-size:13px}
#prev{width:120px;height:120px;border-radius:14px;object-fit:cover;background:#f3ece0;display:block;margin-top:8px}
.msg{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:999px;font-weight:700;opacity:0;transition:.3s;pointer-events:none;z-index:9;max-width:90%;text-align:center}
.msg.show{opacity:1}.hide{display:none}
.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}
.tabs button{flex:0 0 auto;background:#fff;border:1px solid var(--line);color:var(--deep)}
.tabs button.on{background:var(--a1);color:#fff;border-color:var(--a1)}
small.h{color:#80705f}
</style>
</head>
<body>
<header><span>⚙️ إدارة حضرم شوب</span><button class="sec" id="logout" style="padding:6px 12px;font-size:13px">خروج</button></header>
<div class="wrap">

<div class="card" id="login">
  <h3>🔐 تسجيل الدخول</h3>
  <small class="h">الصق رمز GitHub (Token) الخاص بك. يُحفظ في جوالك فقط.</small>
  <label>رمز GitHub</label><input id="tok" type="password" placeholder="github_pat_...">
  <div class="row"><button class="pri" id="loginBtn">دخول</button></div>
</div>

<div id="main" class="hide">
  <div class="tabs"><button data-t="prods" class="on">📦 المنتجات</button><button data-t="form">➕ منتج جديد</button><button data-t="import">📥 استيراد Excel</button><button data-t="settings">⚙️ الإعدادات والأقسام</button></div>

  <div id="t-prods" class="card"><h3>المنتجات (<span id="cnt">0</span>)</h3><input id="filter" placeholder="بحث..."><div id="list"></div></div>

  <div id="t-form" class="card hide">
    <h3 id="formTitle">➕ منتج جديد</h3>
    <label>اسم المنتج</label><input id="f-title">
    <label>السعر (ر.س)</label><input id="f-price" type="number" inputmode="decimal" step="any">
    <label>السعر قبل الخصم (اختياري)</label><input id="f-old" type="number" inputmode="decimal" step="any">
    <label>القسم</label><select id="f-cat"></select>
    <label>الوصف (اختياري)</label><textarea id="f-desc"></textarea>
    <label>الصورة</label><input id="f-img" type="file" accept="image/*"><img id="prev" class="hide" alt="">
    <label style="display:flex;gap:8px;align-items:center"><input id="f-stock" type="checkbox" checked style="width:auto"> متوفر في المخزون</label>
    <div class="row"><button class="pri" id="saveProd">حفظ المنتج</button><button class="sec" id="cancelEdit">إلغاء</button></div>
  </div>

  <div id="t-import" class="card hide">
    <h3>📥 استيراد من Excel أو CSV</h3>
    <small class="h">الأعمدة: <b>الاسم، السعر، السعر القديم، القسم، الوصف، الصورة</b> (رابط الصورة اختياري). الصف الأول عناوين الأعمدة.</small>
    <label>اختر الملف (xlsx / csv)</label><input id="xl" type="file" accept=".xlsx,.xls,.csv">
    <div class="row"><button class="sec" id="tpl">⬇️ تنزيل نموذج</button></div>
    <div id="impInfo" style="margin-top:10px"></div>
    <div class="row hide" id="impRow"><button class="pri" id="impGo">استيراد المنتجات</button></div>
  </div>

  <div id="t-settings" class="card hide">
    <h3>⚙️ الإعدادات</h3>
    <label>اسم المتجر</label><input id="s-name">
    <label>الوصف القصير</label><input id="s-tag">
    <label>رقم واتساب (بصيغة دولية بدون +)</label><input id="s-wa" inputmode="numeric" placeholder="9665XXXXXXXX">
    <label>العملة</label><input id="s-cur">
    <h3 style="margin-top:18px">🧩 الأقسام</h3>
    <div id="catList"></div>
    <div class="row"><input id="c-name" placeholder="اسم القسم"><input id="c-emoji" placeholder="إيموجي" style="max-width:90px"><button class="sec" id="addCat" style="flex:0 0 auto">إضافة</button></div>
    <div class="row"><button class="pri" id="saveSet">حفظ الإعدادات</button></div>
  </div>
</div>
</div>
<div class="msg" id="msg"></div>

<script>
const OWNER="aasa2841996-glitch", REPO="hadhram-shop", API=`https://api.github.com/repos/${OWNER}/${REPO}/contents/`;
const $=s=>document.querySelector(s);
const msg=(t,ms=2600)=>{const m=$("#msg");m.textContent=t;m.classList.add("show");clearTimeout(msg._t);msg._t=setTimeout(()=>m.classList.remove("show"),ms)};
const b64=s=>btoa(unescape(encodeURIComponent(s)));
const unb64=s=>decodeURIComponent(escape(atob(s.replace(/\n/g,""))));
let TOKEN=localStorage.getItem("hs_tok")||"", DATA=null, SHA=null, editId=null, newImg=null, pending=[];
const hdr=()=>({Authorization:"Bearer "+TOKEN,Accept:"application/vnd.github+json"});

async function loadData(){
  const r=await fetch(API+"products.json?t="+Date.now(),{headers:hdr()});
  if(!r.ok) throw new Error(r.status===401?"الرمز غير صحيح":"تعذّر قراءة الملف ("+r.status+")");
  const j=await r.json(); SHA=j.sha; DATA=JSON.parse(unb64(j.content));
  DATA.settings=DATA.settings||{}; DATA.categories=DATA.categories||[]; DATA.products=DATA.products||[];
}
async function saveData(note){
  const body={message:note||"Update products",content:b64(JSON.stringify(DATA,null,1)),sha:SHA};
  const r=await fetch(API+"products.json",{method:"PUT",headers:{...hdr(),"Content-Type":"application/json"},body:JSON.stringify(body)});
  if(r.status===409){await loadData();throw new Error("تعارض، حدّث الصفحة وأعد المحاولة")}
  if(!r.ok) throw new Error("فشل الحفظ ("+r.status+")");
  SHA=(await r.json()).content.sha;
}
async function uploadImage(blob){
  const name="images/"+Date.now().toString(36)+Math.random().toString(36).slice(2,6)+".jpg";
  const base=await new Promise(res=>{const fr=new FileReader();fr.onload=()=>res(fr.result.split(",")[1]);fr.readAsDataURL(blob)});
  const r=await fetch(API+name,{method:"PUT",headers:{...hdr(),"Content-Type":"application/json"},body:JSON.stringify({message:"Add image",content:base})});
  if(!r.ok) throw new Error("فشل رفع الصورة ("+r.status+")");
  return name;
}
function resize(file,max=900){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);c.toBlob(b=>b?res(b):rej(new Error("صورة غير صالحة")),"image/jpeg",.85)};img.onerror=()=>rej(new Error("صورة غير صالحة"));img.src=URL.createObjectURL(file)})}

function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function drawList(){
  const q=$("#filter").value.trim();
  const arr=DATA.products.filter(p=>!q||(p.title||"").includes(q));
  $("#cnt").textContent=DATA.products.length;
  $("#list").innerHTML=arr.map(p=>`<div class="item"><img src="${esc(p.image||"")}" onerror="this.style.opacity=.2"><div class="t">${esc(p.title)}<small>${esc(p.price)} ${esc(DATA.settings.currency||"ر.س")} • ${esc((DATA.categories.find(c=>c.id===p.category)||{}).name||"")} ${p.stock===false?"• نفد":""}</small></div><button class="sec" data-e="${esc(p.id)}">تعديل</button><button class="del" data-d="${esc(p.id)}">حذف</button></div>`).join("")||"<p>لا توجد منتجات بعد. اضغط «منتج جديد».</p>";
}
function drawCats(){
  $("#f-cat").innerHTML=DATA.categories.map(c=>`<option value="${esc(c.id)}">${esc((c.emoji||"")+" "+c.name)}</option>`).join("");
  $("#catList").innerHTML=DATA.categories.map(c=>`<div class="item"><div class="t">${esc((c.emoji||"")+" "+c.name)}</div><button class="del" data-dc="${esc(c.id)}">حذف</button></div>`).join("");
}
function fillSettings(){const s=DATA.settings;$("#s-name").value=s.name||"";$("#s-tag").value=s.tagline||"";$("#s-wa").value=s.whatsapp||"";$("#s-cur").value=s.currency||"ر.س"}
function tab(t){document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t===t));["prods","form","import","settings"].forEach(x=>$("#t-"+x).classList.toggle("hide",x!==t))}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{if(b.dataset.t==="form"&&!editId)resetForm();tab(b.dataset.t)});
function resetForm(){editId=null;newImg=null;$("#formTitle").textContent="➕ منتج جديد";["title","price","old","desc"].forEach(k=>$("#f-"+k).value="");$("#f-img").value="";$("#prev").classList.add("hide");$("#f-stock").checked=true}
async function start(){
  try{await loadData()}catch(e){msg(e.message,4000);$("#login").classList.remove("hide");$("#main").classList.add("hide");return}
  $("#login").classList.add("hide");$("#main").classList.remove("hide");drawCats();drawList();fillSettings();
}
$("#loginBtn").onclick=()=>{TOKEN=$("#tok").value.trim();if(!TOKEN)return;localStorage.setItem("hs_tok",TOKEN);start()};
$("#logout").onclick=()=>{localStorage.removeItem("hs_tok");location.reload()};
$("#filter").oninput=drawList;
$("#list").onclick=async e=>{
  const ed=e.target.dataset.e, dl=e.target.dataset.d;
  if(ed){const p=DATA.products.find(x=>x.id===ed);editId=ed;newImg=null;$("#formTitle").textContent="✏️ تعديل منتج";$("#f-title").value=p.title||"";$("#f-price").value=p.price||"";$("#f-old").value=p.old||"";$("#f-cat").value=p.category||"";$("#f-desc").value=p.desc||"";$("#f-stock").checked=p.stock!==false;$("#f-img").value="";if(p.image){$("#prev").src=p.image;$("#prev").classList.remove("hide")}else $("#prev").classList.add("hide");tab("form")}
  if(dl&&confirm("حذف هذا المنتج؟")){DATA.products=DATA.products.filter(x=>x.id!==dl);try{await saveData("Delete product");drawList();msg("تم الحذف ✅")}catch(er){msg(er.message,4000);await loadData();drawList()}}
};
$("#f-img").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{newImg=await resize(f);$("#prev").src=URL.createObjectURL(newImg);$("#prev").classList.remove("hide")}catch(er){msg(er.message)}};
$("#cancelEdit").onclick=()=>{resetForm();tab("prods")};
$("#saveProd").onclick=async()=>{
  const title=$("#f-title").value.trim(),price=parseFloat($("#f-price").value);
  if(!title||!(price>0)){msg("اكتب الاسم والسعر");return}
  if(!DATA.categories.length){msg("أضف قسماً أولاً من الإعدادات");return}
  $("#saveProd").disabled=true;msg("جارٍ الحفظ...",8000);
  try{
    let p=editId?DATA.products.find(x=>x.id===editId):{id:"p"+Date.now().toString(36),createdAt:new Date().toISOString()};
    if(newImg)p.image=await uploadImage(newImg);
    Object.assign(p,{title,price,old:parseFloat($("#f-old").value)||0,category:$("#f-cat").value,desc:$("#f-desc").value.trim(),stock:$("#f-stock").checked});
    if(!editId)DATA.products.unshift(p);
    await saveData(editId?"Edit product":"Add product");
    resetForm();drawList();tab("prods");msg("تم الحفظ ✅ (يظهر في المتجر خلال دقيقة)",3500);
  }catch(er){msg(er.message,4500);try{await loadData()}catch{}}
  $("#saveProd").disabled=false;
};
$("#addCat").onclick=()=>{const n=$("#c-name").value.trim();if(!n)return;DATA.categories.push({id:"c"+Date.now().toString(36),name:n,emoji:$("#c-emoji").value.trim()||"🛍️"});$("#c-name").value="";$("#c-emoji").value="";drawCats()};
$("#catList").onclick=e=>{const id=e.target.dataset.dc;if(id&&confirm("حذف القسم؟")){DATA.categories=DATA.categories.filter(c=>c.id!==id);drawCats()}};
$("#saveSet").onclick=async()=>{
  DATA.settings={...DATA.settings,name:$("#s-name").value.trim(),tagline:$("#s-tag").value.trim(),whatsapp:$("#s-wa").value.replace(/\D/g,""),currency:$("#s-cur").value.trim()||"ر.س"};
  try{await saveData("Update settings");msg("تم الحفظ ✅")}catch(er){msg(er.message,4000)}
};
/* ===== الاستيراد ===== */
const K={title:["الاسم","اسم المنتج","title","name"],price:["السعر","price"],old:["السعر القديم","السعر قبل الخصم","old"],cat:["القسم","الفئة","category"],desc:["الوصف","desc","description"],image:["الصورة","رابط الصورة","image"]};
const pick=(row,keys)=>{for(const k of keys){for(const rk of Object.keys(row)){if(rk.trim().toLowerCase()===k)return row[rk]}}return""};
$("#xl").onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{
    const wb=XLSX.read(await f.arrayBuffer(),{type:"array"});
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:""});
    pending=rows.map(r=>({title:String(pick(r,K.title)).trim(),price:parseFloat(pick(r,K.price)),old:parseFloat(pick(r,K.old))||0,cat:String(pick(r,K.cat)).trim(),desc:String(pick(r,K.desc)).trim(),image:String(pick(r,K.image)).trim()})).filter(r=>r.title&&r.price>0);
    $("#impInfo").innerHTML=pending.length?`✅ تم العثور على <b>${pending.length}</b> منتج جاهز للاستيراد.`:"⚠️ لم أجد صفوفاً صحيحة. تأكد من عناوين الأعمدة (الاسم، السعر).";
    $("#impRow").classList.toggle("hide",!pending.length);
  }catch(er){msg("تعذّر قراءة الملف")}
};
$("#impGo").onclick=async()=>{
  $("#impGo").disabled=true;msg("جارٍ الاستيراد...",8000);
  try{
    for(const r of pending){
      let c=DATA.categories.find(x=>x.name===r.cat);
      if(!c){c={id:"c"+Date.now().toString(36)+Math.random().toString(36).slice(2,4),name:r.cat||"منتجات عامة",emoji:"🛍️"};DATA.categories.push(c)}
      DATA.products.unshift({id:"p"+Date.now().toString(36)+Math.random().toString(36).slice(2,5),title:r.title,price:r.price,old:r.old,category:c.id,desc:r.desc,image:r.image,stock:true,createdAt:new Date().toISOString()});
    }
    await saveData("Import products");pending=[];$("#impRow").classList.add("hide");$("#impInfo").innerHTML="";$("#xl").value="";drawCats();drawList();tab("prods");msg("تم الاستيراد ✅ (يمكنك إضافة الصور بالتعديل على كل منتج)",4500);
  }catch(er){msg(er.message,4500)}
  $("#impGo").disabled=false;
};
$("#tpl").onclick=()=>{const ws=XLSX.utils.aoa_to_sheet([["الاسم","السعر","السعر القديم","القسم","الوصف","الصورة"],["عطر ملكي 100مل",120,150,"العطور","عطر فاخر يدوم طويلاً",""]]);const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"منتجات");XLSX.writeFile(wb,"نموذج-المنتجات.xlsx")};
if(TOKEN)start();
</script>
</body>
</html>
