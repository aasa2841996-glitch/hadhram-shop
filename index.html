<style>
:root{--deep:#241406;--brown:#3a2210;--brown2:#52301a;--gold:#f0b13a;--gold2:#ffd27a;--gold3:#c98a1a;--cream:#fbf4e8;--bg:#f6efe4;--ink:#241406;--muted:#8a7a68;--line:#eadfce;--hot:#d92d20;--wa:#25d366;--sh:0 4px 16px rgba(36,20,6,.10)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Tajawal","Segoe UI",Tahoma,sans-serif}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom));min-height:100vh}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
img{max-width:100%;display:block}
.wrap{max-width:560px;margin:0 auto}
svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.top{position:sticky;top:0;z-index:30;background:linear-gradient(180deg,var(--deep),var(--brown));color:#fff;padding-top:env(safe-area-inset-top);box-shadow:0 4px 16px rgba(0,0,0,.3)}
.bar{display:flex;align-items:center;gap:10px;padding:10px 12px 8px}
.logo{display:flex;align-items:center;gap:8px;font-weight:900;font-size:20px;color:var(--gold2);white-space:nowrap;cursor:pointer}
.logo img{width:36px;height:36px;border-radius:10px;box-shadow:0 0 0 1.5px var(--gold)}
.search{flex:1;display:flex;align-items:center;gap:6px;background:#fff;border-radius:999px;padding:1px 14px;color:var(--ink);min-width:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.05)}
.search input{flex:1;border:0;outline:0;font:inherit;font-size:14px;background:none;padding:9px 0;min-width:0}
.search svg{width:19px;height:19px;color:var(--brown)}
.cartbtn{position:relative;width:40px;height:40px;display:grid;place-items:center;color:#fff}
.cnt{position:absolute;top:-1px;left:-3px;min-width:19px;height:19px;border-radius:999px;background:var(--hot);color:#fff;font-weight:900;font-size:11px;display:grid;place-items:center;padding:0 4px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 12px 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.22);font-weight:800;font-size:13px;color:#fff;white-space:nowrap;background:rgba(255,255,255,.05)}
.chip.on{background:linear-gradient(180deg,var(--gold2),var(--gold));border-color:var(--gold);color:var(--deep)}
main{padding:0 0 10px}
.hero{position:relative;margin:12px 12px 0;border-radius:20px;overflow:hidden;box-shadow:var(--sh);border:1px solid rgba(240,177,58,.55)}
.slides{display:flex;transition:transform .5s ease;direction:ltr}
.slide{min-width:100%;direction:rtl;min-height:190px;display:flex;align-items:stretch;color:#fff;position:relative;background:linear-gradient(110deg,#1c0f04,#4a2b12 60%,#7a4a1c)}
.slide .tx{flex:1;padding:18px 16px;display:flex;flex-direction:column;justify-content:center;gap:8px;z-index:1}
.slide h3{margin:0;font-size:24px;font-weight:900;line-height:1.3;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.4)}
.slide p{margin:0;font-size:13px;opacity:.92}
.slide .cta{align-self:flex-start;background:linear-gradient(180deg,var(--gold2),var(--gold));color:var(--deep);font-weight:900;border-radius:999px;padding:9px 22px;font-size:14.5px;box-shadow:0 4px 12px rgba(0,0,0,.35)}
.slide .im{width:46%;position:relative;overflow:hidden}
.slide .im img{width:100%;height:100%;object-fit:cover;-webkit-mask-image:linear-gradient(to left,#000 70%,transparent);mask-image:linear-gradient(to left,#000 70%,transparent)}
.slide .em{width:46%;display:grid;place-items:center;font-size:86px}
.slide .off{position:absolute;top:12px;left:12px;background:radial-gradient(circle,#e23a2c,#b3180f);color:#fff;width:68px;height:68px;border-radius:50%;display:grid;place-items:center;text-align:center;font-weight:900;font-size:19px;line-height:1.05;box-shadow:0 0 0 3px var(--gold2),0 6px 14px rgba(0,0,0,.4);z-index:2}
.slide .off small{display:block;font-size:11px}
.dots{position:absolute;bottom:8px;right:0;left:0;display:flex;justify-content:center;gap:6px;z-index:2}
.dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.5)}
.dots i.on{background:var(--gold2);width:18px;border-radius:5px}
.perks{display:grid;grid-template-columns:repeat(4,1fr);margin:12px 12px 0;background:#fff;border-radius:16px;padding:10px 2px;box-shadow:var(--sh);border:1px solid var(--line)}
.perks div{text-align:center;font-size:11px;font-weight:800;line-height:1.35;padding:0 3px;border-left:1px solid var(--line)}
.perks div:last-child{border-left:0}
.perks i{display:block;font-style:normal;font-size:21px;margin-bottom:2px}
.sec{margin-top:16px;padding:0 12px}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin:0 2px 10px}
.sec-h h3{margin:0;font-size:20px;font-weight:900;display:flex;align-items:center;gap:6px}
.sec-h button{color:var(--gold3);font-weight:800;font-size:13px}
.sub{margin:-8px 2px 10px;color:var(--muted);font-size:13px;font-weight:600}
.tiles{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}
.tiles::-webkit-scrollbar{display:none}
.tile{flex:0 0 auto;width:96px;text-align:center;background:linear-gradient(180deg,#fff,var(--cream));border:1px solid var(--line);border-radius:16px;padding:10px 4px 10px;box-shadow:var(--sh)}
.tile .ic{font-size:32px;height:70px;display:grid;place-items:center;margin-bottom:6px}
.tile .ic.hasimg img{width:66px;height:66px;object-fit:cover;border-radius:16px}
.tile b{font-size:12.5px;font-weight:800;display:block;line-height:1.3;margin-top:4px}
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:10px 12px}
.cgrid .tile{width:auto}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:0 12px}
.pc{background:#fff;border-radius:16px;overflow:hidden;box-shadow:var(--sh);display:flex;flex-direction:column;border:1px solid var(--line)}
.pimg{position:relative;aspect-ratio:1/1;background:#f1ece3;cursor:pointer;display:grid;place-items:center}
.pimg img{width:100%;height:100%;object-fit:cover}
.tag{position:absolute;top:8px;right:8px;background:linear-gradient(180deg,#e8473a,#c4251a);color:#fff;font-weight:900;font-size:12px;line-height:1.1;padding:5px 9px;border-radius:9px;text-align:center}
.fav{position:absolute;top:8px;left:8px;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.95);display:grid;place-items:center;font-size:17px;color:#9b8f80;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.fav.on{color:var(--hot)}
.sold{position:absolute;inset:0;background:rgba(255,255,255,.72);display:grid;place-items:center;font-weight:900;color:var(--hot)}
.pb{padding:9px 10px 11px;display:flex;flex-direction:column;gap:6px;flex:1}
.pt{font-size:13.5px;font-weight:800;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:39px}
.pr{display:flex;flex-direction:column;align-items:flex-start;gap:0;min-height:44px}
.pr b{font-size:18px;font-weight:900;color:var(--brown);white-space:nowrap;line-height:1.25}
.pr s{line-height:1.2}
.pr s{font-size:12px;color:var(--muted)}
.addw{margin-top:auto;display:flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(180deg,var(--brown2),var(--deep));color:var(--gold2);font-weight:800;border-radius:12px;padding:10px 6px;font-size:13.5px;box-shadow:0 3px 8px rgba(36,20,6,.3)}
.addw svg{width:19px;height:19px}
.addw:active{transform:scale(.97)}
.empty{text-align:center;color:var(--muted);padding:34px 12px;font-weight:700}
.backbar{display:flex;align-items:center;gap:8px;padding:14px 14px 8px}
.backbar h2{margin:0;font-size:19px;font-weight:900}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:40;background:linear-gradient(180deg,var(--brown),var(--deep));border-radius:22px 22px 0 0;padding:8px 8px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -6px 22px rgba(0,0,0,.3);border-top:1px solid rgba(240,177,58,.4)}
.nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);gap:2px}
.nav .in a.tr{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:800;color:var(--gold2);padding:7px 0;border-radius:16px;text-decoration:none;border:1.5px solid rgba(240,177,58,.5)}
.nav .in a.tr b{font-size:20px;line-height:23px}
.nav button{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:800;color:#d9c7ad;padding:7px 0;border-radius:16px}
.nav button svg{width:23px;height:23px}
.nav button.on{color:var(--deep);background:linear-gradient(180deg,var(--gold2),var(--gold));box-shadow:0 4px 12px rgba(240,177,58,.4)}
.nav .nb{position:absolute;top:1px;left:50%;margin-left:8px;min-width:18px;height:18px;border-radius:999px;background:var(--hot);color:#fff;font-size:10.5px;font-weight:900;display:grid;place-items:center;padding:0 4px}
.pg{position:fixed;inset:0;z-index:70;background:#fff;overflow:auto;display:none;padding-bottom:calc(86px + env(safe-area-inset-bottom))}
.pg.show{display:block}
.pg .hd{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 12px 0;pointer-events:none}
.pg .hd button{pointer-events:auto;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.95);box-shadow:var(--sh);font-size:20px;display:grid;place-items:center}
.gwrap{max-width:560px;margin:-50px auto 0;position:relative}
.gal2{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;background:#f1ece3}
.gal2::-webkit-scrollbar{display:none}
.gal2 img{flex:0 0 100%;scroll-snap-align:center;aspect-ratio:1/1;object-fit:cover;width:100%}
.gdots{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:6px}
.gdots i{width:7px;height:7px;border-radius:50%;background:#fff8;box-shadow:0 0 3px #0006}.gdots i.on{background:#fff;width:18px;border-radius:5px}
.gth{display:flex;gap:6px;padding:8px 14px 0;overflow-x:auto}.gth img{width:54px;height:54px;border-radius:10px;object-fit:cover;border:2px solid transparent;flex:none}.gth img.on{border-color:var(--hot)}
.rcv{position:fixed;left:10px;right:10px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:45;max-width:560px;margin:0 auto;background:#fff;border:2px solid #d4a017;border-radius:16px;padding:12px;box-shadow:0 8px 30px #0005;font-weight:800}
.rcv b{display:block;margin-bottom:8px;font-size:14px}.rcv .bt{display:flex;gap:8px}
.rcv .bt button{flex:1;border:0;border-radius:12px;padding:11px;font-weight:900;font-size:14px;font-family:inherit;cursor:pointer}
.rcv .y{background:#1b8a46;color:#fff}.rcv .n{background:#f3ece0;color:#b3261e}
.rcvd{margin-top:8px;font-weight:800;font-size:13px;color:#1b8a46}.rcvd.no{color:#b3261e}
.optg{margin:10px 0}.optg b{display:block;font-size:13.5px;margin-bottom:6px}
.optv{display:flex;flex-wrap:wrap;gap:8px}.optv button{border:1.5px solid #d8cfc0;background:#fff;border-radius:10px;padding:7px 14px;font-weight:800;font-size:14px;cursor:pointer;font-family:inherit}
.optv button.on{border-color:var(--hot);background:var(--hot);color:#fff}
.optv.need button{border-color:var(--hot)}
.ci .sl{display:block;font-size:12.5px;color:#9a6b00;font-weight:800}
.pg img.big{width:100%;max-width:560px;margin:-50px auto 0;aspect-ratio:1/1;object-fit:cover;background:#f1ece3}
.pg .bd{max-width:560px;margin:0 auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.pg .price{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.pg .price b{font-size:28px;font-weight:900;color:var(--brown)}
.yer{display:block;width:100%;font-size:12px;font-weight:800;color:var(--muted)}
.pg .price s{color:var(--muted)}
.pg .price .off{background:var(--hot);color:#fff;font-weight:900;border-radius:6px;padding:2px 8px;font-size:13px}
.pg h3{margin:0;font-size:18px;line-height:1.5}
.pg p{margin:0;color:var(--muted);line-height:1.9;white-space:pre-wrap}
.qty{display:flex;align-items:center;gap:14px;font-weight:800}
.qb{width:36px;height:36px;border-radius:50%;background:var(--cream);font-size:20px;font-weight:900;border:1px solid var(--line)}
.actbar{position:fixed;bottom:0;left:0;right:0;z-index:3;background:#fff;border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;max-width:560px;margin:0 auto}
.btn{flex:1;border-radius:12px;padding:13px 8px;font-weight:900;font-size:15px}
.btn.cart{background:linear-gradient(180deg,var(--brown2),var(--deep));color:var(--gold2)}
.btn.buy{background:linear-gradient(180deg,var(--gold2),var(--gold));color:var(--deep)}
.btn.wa{background:var(--wa);color:#fff}
.btn.wide{width:100%;flex:none;display:block;text-align:center}
.ci{display:flex;gap:10px;background:#fff;border-radius:14px;padding:8px;margin:0 12px 8px;box-shadow:var(--sh);border:1px solid var(--line)}
.ci img{width:76px;height:76px;border-radius:10px;object-fit:cover;background:#f1ece3;flex:0 0 auto}
.ci .tt{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}
.ci .tt b{font-size:13.5px;line-height:1.4}
.ci .tt .p{font-weight:900;color:var(--brown)}
.ci .ctl{display:flex;align-items:center;justify-content:space-between}
.ci .qty .qb{width:30px;height:30px;font-size:17px}
.rm{color:var(--muted);font-size:13px;font-weight:800}
.sum{margin:10px 12px;background:#fff;border-radius:14px;padding:12px 14px;box-shadow:var(--sh);border:1px solid var(--line)}
.sum .ln{display:flex;justify-content:space-between;padding:6px 0;font-weight:800;font-size:18px}
.frm{margin:10px 12px;background:#fff;border-radius:14px;padding:12px 14px;box-shadow:var(--sh);border:1px solid var(--line)}
.frm label{display:block;font-weight:800;font-size:13px;margin:8px 0 4px}
.frm input,.frm textarea{width:100%;font:inherit;font-size:15px;padding:10px;border:1px solid var(--line);border-radius:10px}
.me a,.me .li{display:flex;align-items:center;gap:10px;padding:14px;border-bottom:1px solid var(--line);font-weight:800;color:inherit;text-decoration:none;background:#fff}
.sortbar{display:flex;gap:8px;overflow-x:auto;padding:2px 12px 10px;scrollbar-width:none;align-items:center}
.sortbar::-webkit-scrollbar{display:none}
.sortbar span{flex:0 0 auto;font-size:12.5px;font-weight:800;color:var(--muted)}
.sb{flex:0 0 auto;padding:6px 13px;border-radius:999px;background:#fff;border:1px solid var(--line);font-weight:800;font-size:12.5px;color:var(--ink)}
.sb.on{background:var(--deep);color:var(--gold2);border-color:var(--deep)}
.cntline{padding:0 14px 6px;color:var(--muted);font-weight:700;font-size:12.5px}
.newb{position:absolute;bottom:8px;right:8px;background:linear-gradient(180deg,var(--gold2),var(--gold));color:var(--deep);font-weight:900;font-size:11px;padding:3px 9px;border-radius:8px;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.hrow{display:flex;gap:10px;overflow-x:auto;padding:2px 12px 10px;scrollbar-width:none}
.hrow::-webkit-scrollbar{display:none}
.hrow .pc{flex:0 0 156px}
.tile small{display:block;font-size:11px;color:var(--muted);font-weight:700}
.sk{background:linear-gradient(100deg,#eee6d8 30%,#f8f2e8 50%,#eee6d8 70%);background-size:200% 100%;animation:shim 1.2s infinite linear;border-radius:16px}
@keyframes shim{to{background-position:-200% 0}}
.skg{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:12px}
.skg .sk{aspect-ratio:3/4}
.save{display:inline-block;background:#e7f6ec;color:#12803c;font-weight:900;font-size:13px;border-radius:8px;padding:3px 10px}
.trust{display:flex;gap:8px;flex-wrap:wrap}
.trust span{background:var(--cream);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:12px;font-weight:800}
.simh{margin:6px 14px 8px;font-size:17px;font-weight:900}
.pg .hd .hb{display:flex;gap:8px}
.clr{display:block;margin:2px auto 8px;color:var(--muted);font-weight:800;font-size:13px;text-decoration:underline}
.ok{margin:30px 14px;text-align:center;background:#fff;border:1px solid var(--line);border-radius:18px;padding:26px 16px;box-shadow:var(--sh)}
.ok b{display:block;font-size:20px;margin:8px 0}
.wlc{position:fixed;inset:0;z-index:200;background:#fafafa;display:flex;flex-direction:column;overflow:auto;transition:opacity .45s,transform .45s}
.wlc.out{opacity:0;transform:scale(1.04);pointer-events:none}
.wlc .ph{flex:none;width:100%;max-width:560px;margin:0 auto;aspect-ratio:750/535;background:url(welcome.jpg?v=3) center top/100% 100% no-repeat}
.wlc .bt{flex:1;display:flex;flex-direction:column;justify-content:flex-start;align-items:center;padding:6px 24px calc(28px + env(safe-area-inset-bottom));text-align:center;color:#111}
.wlc h2{font-size:26px;font-weight:900;margin:0 0 8px}
.wlc p{margin:0 0 22px;color:#666;font-weight:700;font-size:15px;line-height:1.6;max-width:320px}
.wlc button{width:100%;max-width:420px;border-radius:999px;padding:16px;font-weight:900;font-size:19px;border:0;cursor:pointer;color:#111;background:#ffd500;box-shadow:0 6px 18px rgba(255,213,0,.45)}

.wlc small{display:block;color:#888;font-weight:700;margin-top:12px;font-size:12.5px}

<script>
const $=(s,r=document)=>r.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nf=n=>(Math.round(n*100)/100).toLocaleString("en-US",{maximumFractionDigits:2});
const safeUrl=u=>(/^\s*(javascript|vbscript):/i.test(String(u||""))?"":String(u||""));
const norm=t=>String(t||"").toLowerCase().replace(/[ً-ٰٟـ]/g,"").replace(/[أإآ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه");
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}},del(k){try{localStorage.removeItem(k)}catch{}}};
const toast=t=>{const el=$("#toast");el.textContent=t;el.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove("show"),1700)};
const ICON_CART2='<svg viewBox="0 0 24 24"><path d="M3 4h2l2.4 11.2a2 2 0 002 1.6h7.4a2 2 0 002-1.5L20.5 8H6"/><circle cx="10" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/></svg>';

let S={name:"وفر",tagline:"منتجات مختارة بأسعار مميزة",whatsapp:"",currency:"ر.س"}, CATS=[], ALL=[], byId=new Map();
let view={name:"home"}, slideT=null;
const app=$("#app"); let SORT="new";
const saved=()=>LS.get("hs_saved",[]);
let CART=LS.get("hs_cart",[]); // [{id,q}]
const saveCart=()=>{LS.set("hs_cart",CART);drawBadges()};

let MPROD=LS.get("hs_mp",[]);
function ingest(d){
  S={...S,...(d.settings||{})}; CATS=d.categories||[];
  const api=(S.orderApi||"").replace(/\/$/,"");
  const mp=(MPROD||[]).map(p=>({id:p.id,title:p.title,price:p.price,currency:p.cur,old:p.old,image:p.img?api+"/img/"+p.img:"",images:(p.imgs||[]).map(x=>api+"/img/"+x),opts:fixOpts(p.opts),category:p.cat,desc:p.desc,priceYer:p.price_yer,stock:p.stock,createdAt:new Date(p.created).toISOString(),merchant:p.merchant,mid:p.mid||0}));
  ALL=[...(d.products||[]),...mp].map(p=>({mn:p.merchant||"",mid:p.mid||0,rate:parseFloat(p.rating)||0,rc:parseInt(p.reviews)||0,ship:String(p.ship||"").slice(0,40),id:String(p.id),title:p.title||"منتج",price:parseFloat(p.price)||0,cur:p.currency==="YER"?"ر.ي":"ر.س",old:parseFloat(p.old)||0,image:p.image||"",imgs:(p.images&&p.images.length?p.images:(p.image?[p.image]:[])),opts:fixOpts(p.opts),cat:p.category||"",desc:p.desc||"",yer:parseFloat(p.priceYer)||0,stock:p.stock!==false,created:Date.parse(p.createdAt)||0}))
    .filter(p=>p.price>0).sort((a,b)=>b.created-a.created);
  applyRat(); setTimeout(loadRatings,0);
  byId=new Map(ALL.map(x=>[x.id,x]));
  CART=CART.filter(i=>byId.has(i.id));
  $("#shopName").textContent=S.name; document.title=S.name;
}
const SKEL='<div class="sk" style="margin:12px;height:190px"></div><div class="skg"><div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>';
async function boot(){
  const c=LS.get("hs_cache",null); let raw="";
  if(c){ingest(c);raw=JSON.stringify(c);render();openFromHash()} else app.innerHTML=SKEL;
  try{
    const r=await fetch("products.json?v="+Math.floor(Date.now()/30000),{cache:"no-store"});
    const d=await r.json();
    let mraw=JSON.stringify(MPROD||[]);
    const api=((d.settings||{}).orderApi||"").replace(/\/$/,"");
    if(api){loadCenters(api);loadBanners(api)}
    if(api){try{const mr=await fetch(api+"/products");const mj=await mr.json();MPROD=mj.products||[];LS.set("hs_mp",MPROD)}catch(e){}}
    const s=JSON.stringify(d)+JSON.stringify(MPROD);
    if(s!==raw+(c?mraw:"")||!c){ingest(d);LS.set("hs_cache",d);render();openFromHash()}
  }catch(e){console.error(e); if(!c){ app.innerHTML='<div class="empty">تعذّر تحميل المنتجات، تحقق من الاتصال وأعد المحاولة</div>' }}
}
let hashDone=false;
function openFromHash(){ if(hashDone) return; const m=location.hash.match(/p=([^&]+)/); if(m&&byId.has(decodeURIComponent(m[1]))){hashDone=true;openPage(decodeURIComponent(m[1]))} else if(ALL.length) hashDone=true }
const disc=p=>p.old>p.price?Math.round((1-p.price/p.old)*100):0;
function drawBadges(){
  const n=CART.reduce((a,i)=>a+i.q,0);
  for(const id of ["cartCnt","navCnt","dCnt"]){const el=$("#"+id);el.style.display=n?"grid":"none";el.textContent=n}
}
const selKey=(id,sel)=>id+(sel&&Object.keys(sel).length?"|"+Object.keys(sel).sort().map(k=>k+"="+sel[k]).join("&"):"");
const selTxt=sel=>sel?Object.entries(sel).map(([k,v])=>k+": "+v).join("، "):"";
function addToCart(id,q=1,quiet,sel){
  const p=byId.get(id); if(!p||!p.stock) return;
  const k=selKey(id,sel);
  const it=CART.find(i=>(i.k||i.id)===k); if(it) it.q+=q; else CART.push({id,q,sel:sel||undefined,k});
  saveCart();
  const c=$("#cartCnt");c.classList.remove("bump");void c.offsetWidth;c.classList.add("bump");
  if(!quiet) toast("أُضيف إلى السلة 🛒");
}
const isNew=p=>p.created&&Date.now()-p.created<3*864e5;
function card(p){

  return `<article class="pc" data-act="open" data-id="${esc(p.id)}"><div class="pimg">

    <div class="pb"><div class="pt">${esc(p.title)}</div><div class="sn"><span class="sic"><svg viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9l1.5-5h13L20 9"/><path d="M4 9a2.7 2.7 0 005.3 0 2.7 2.7 0 005.4 0A2.7 2.7 0 0020 9"/><path d="M5 12v8h14v-8"/><path d="M10 20v-4h4v4"/></svg></span><span class="snt">${esc(p.mn||S.name)}${(CATS.find(c=>c.id===p.cat)||{}).name&&p.cat!=="general"?" | "+esc(CATS.find(c=>c.id===p.cat).name):""}</span></div>
    ${p.rate>0&&p.rc>0?`<div class="rt"><b>${nf(p.rate)}</b> <span class="stars">★</span> <span>(${nf(p.rc)})</span></div>`:""}
    <div class="pr"><b>${nf(p.price)} ${esc(p.cur)}</b>${d?`<s>${nf(p.old)} ${esc(p.cur)}</s>`:""}${d>=1?`<span class="dp2">-${d}%</span>`:""}</div>
    ${p.yer?`<div class="pr2">${nf(p.yer)} ر.ي</div>`:""}
    ${p.ship?`<div class="shp">🚚 ${esc(p.ship)}</div>`:""}
    ${p.stock?`<button class="addw" data-act="${p.opts&&p.opts.length?"open":"add"}" data-id="${esc(p.id)}">${p.opts&&p.opts.length?"أضف إلى السلة":"أضف إلى السلة"} ${ICON_CART2}</button>`:""}</div></article>`;
}
const SORTS=[["new","الأحدث"],["low","الأقل سعراً"],["high","الأعلى سعراً"],["disc","الأعلى خصماً"]];

function listView(a){
  if(!a.length) return grid(a);
  return `<div class="cntline">${a.length} منتج</div>`+(a.length>1?`<div class="sortbar"><span>ترتيب:</span>${SORTS.map(([k,t])=>`<button class="sb ${SORT===k?"on":""}" data-act="sort" data-id="${k}">${t}</button>`).join("")}</div>`:"")+grid(sorted(a));

function categoryKey(c){
  const n=norm([c.name,c.id,c.slug].filter(Boolean).join(" "));
  const rules=[
    [/عطر|عطور|perfume|fragrance/,"perfume"],
    [/فستان|فساتين|dress|gown/,"dress"],
    [/جمال|عنايه|تجميل|مكياج|beauty|care|makeup/,"beauty"],
    [/الكترون|إلكترون|جوال|هاتف|سماعه|سماعات|كمبيوتر|لابتوب|electronic|phone|audio/,"electronics"],
    [/ملابس|لباس|ازياء|أزياء|رجال|نساء|fashion|clothing|apparel/,"clothing"],
    [/شنط|حقائب|حقيبه|شنطة|bags|bag/,"bags"],
    [/اكسسوار|إكسسوار|اكسسوارات|إكسسوارات|ساع|accessor|watch/,"accessories"],
    [/مطبخ|قدور|اواني|أواني|ادوات منزليه|أدوات منزلية|kitchen|cookware/,"kitchen"],
    [/منزل|ديكور|اثاث|أثاث|مفروشات|home|decor|furniture/,"home"],
    [/عام|عامة|متنوع|الكل|all|general/,"general"]
  ];
  for(const [re,key] of rules) if(re.test(n)) return key;
  return "general";
}
const EMO={dress:"👗",beauty:"💄",general:"🛍️",perfume:"🧴",electronics:"📱",clothing:"👕",bags:"👜",accessories:"⌚",kitchen:"🍳",home:"🛋️"};
const catEmo=c=>c.emoji||EMO[categoryKey(c)]||"🛍️";
const catImg=c=>{if(c.img)return c.img;if(c.image)return c.image;const k=categoryKey(c);if(k==="dress"||k==="beauty"){const pi=(ALL.find(p=>p.cat===c.id&&p.image)||{}).image;return pi||""}if(k!=="general")return CATEGORY_ART[k];return (ALL.find(p=>p.cat===c.id&&p.image)||{}).image||CATEGORY_ART.general};
const hasCats=()=>CATS.filter(c=>!c.hidden&&c.id!=="general"&&(c.img||ALL.some(p=>p.cat===c.id)));
const catDisc=c=>{let m=0;ALL.forEach(p=>{if(p.cat===c.id&&p.old>p.price&&p.price>0)m=Math.max(m,Math.round((1-p.price/p.old)*100))});return m};
const nCard=c=>{if(c.img)return `<button class="nc ni" data-act="cat" data-id="${esc(c.id)}" aria-label="${esc(c.name)}"><img loading="lazy" src="${esc(safeUrl(c.img))}" alt="${esc(c.name)}"></button>`;const im=catImg(c),d=catDisc(c),n=ALL.filter(p=>p.cat===c.id).length;
  return `<button class="nc" data-act="cat" data-id="${esc(c.id)}"><div class="nim">${im?`<img loading="lazy" src="${esc(safeUrl(im))}" alt="" onerror="this.remove()">`:`<span>${esc(catEmo(c))}</span>`}<i>${d>=5?"خصم حتى "+d+"%":n+" منتج"}</i></div><b>${esc(c.name)}</b></button>`};
document.addEventListener("click",e=>{const b=e.target.closest("[data-ns]");if(!b)return;const s=$("#ns");if(s)s.scrollBy({left:Number(b.dataset.ns)*s.clientWidth*0.8,behavior:"smooth"})});
const circ=c=>{if(c.img)return `<button class="tile timg" data-act="cat" data-id="${esc(c.id)}" aria-label="${esc(c.name)}"><img loading="lazy" src="${esc(safeUrl(c.img))}" alt="${esc(c.name)}"></button>`;const im=catImg(c);return `<button class="tile" data-act="cat" data-id="${esc(c.id)}"><div class="ic ${im?"hasimg":"emo"}">${im?`<img loading="lazy" src="${esc(safeUrl(im))}" alt="" onerror="this.parentNode.className='ic emo';this.parentNode.textContent='🛍'">`:esc(catEmo(c))}</div><b>${esc(c.name)}</b><small>${ALL.filter(p=>p.cat===c.id).length} منتج</small></button>`}
function mini(p){return `<div class="mini" data-act="open" data-id="${esc(p.id)}"><span class="tag">-${disc(p)}%</span><div class="im">${p.image?`<img loading="lazy" src="${esc(safeUrl(p.image))}" alt="">`:""}</div><div class="pr">${nf(p.price)} ${esc(p.cur)}<s>${nf(p.old)} ${esc(p.cur)}</s></div></div>`}

function chipIc(c){const im=c.img?"":catImg(c);return im?`<img class="cim" src="${esc(safeUrl(im))}" alt="">`:`<span class="cem">${esc(catEmo(c))}</span>`}
function drawChips(){
  const cur=view.name==="cat"?view.id:(view.name==="home"?"":"__");
  $("#chips").innerHTML=`<button class="chip ${cur===""?"on":""}" data-go="home"><svg class="cgi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>الكل</button>`+hasCats().map(c=>`<button class="chip ${cur===c.id?"on":""}" data-act="cat" data-id="${esc(c.id)}">${chipIc(c)}${esc(c.name)}</button>`).join("");
}
function home(){
  const deals=ALL.filter(p=>disc(p)>=5&&p.stock).sort((a,b)=>disc(b)-disc(a));
  const feat=(ALL.filter(p=>p.image&&p.stock));
  const slides=[];
  BAN.forEach((b,i)=>{if(b.img)slides.push(`<div class="slide bn" ${b.link?`data-bn="${i}"`:""}><img src="${esc(safeUrl(b.img))}" alt="" loading="${i?"lazy":"eager"}">${b.title||b.sub?`<div class="bt">${b.title?`<b>${esc(b.title)}</b>`:""}${b.sub?`<small>${esc(b.sub)}</small>`:""}</div>`:""}</div>`)});
  if(!slides.length)feat.slice(0,3).forEach(p=>{const d=disc(p);slides.push(`<div class="slide">${d>=5?`<div class="off"><div><small>خصم</small>${d}%</div></div>`:""}<div class="tx"><h3>${esc(p.title.length>38?p.title.slice(0,38)+"…":p.title)}</h3><p class="pp"><b>${nf(p.price)} ${esc(p.cur)}</b>${d?`<s>${nf(p.old)} ${esc(p.cur)}</s>`:""}</p><button class="cta" data-act="open" data-id="${esc(p.id)}">تسوّق الآن ‹</button></div><div class="im"><img src="${esc(safeUrl(p.image))}" alt=""></div></div>`)});

/* مولّد QR صغير (بايتات ASCII، تصحيح M، الإصدارات 1–6) */
function wfrQR(text){
  const data=Array.from(unescape(encodeURIComponent(String(text))),c=>c.charCodeAt(0));
  const VS=[null,{n:21,d:16,e:10,b:1},{n:25,d:28,e:16,b:1},{n:29,d:44,e:26,b:1},{n:33,d:32,e:18,b:2},{n:37,d:43,e:24,b:2},{n:41,d:27,e:16,b:4}];
  let ver=0;for(let v=1;v<=6;v++){if(data.length<=VS[v].d*VS[v].b-2){ver=v;break}}
  if(!ver)return null;
  const V=VS[ver],n=V.n,total=V.d*V.b;
  // بتات البيانات
  const bits=[];const put=(val,len)=>{for(let i=len-1;i>=0;i--)bits.push((val>>i)&1)};
  put(4,4);put(data.length,8);data.forEach(b=>put(b,8));
  for(let i=0;i<4&&bits.length<total*8;i++)bits.push(0);
  while(bits.length%8)bits.push(0);
  const cw=[];for(let i=0;i<bits.length;i+=8){let x=0;for(let j=0;j<8;j++)x=x<<1|bits[i+j];cw.push(x)}
  for(let p=0;cw.length<total;p++)cw.push(p%2?0x11:0xEC);
  // GF(256)
  const EXP=new Array(512),LOG=new Array(256);let x=1;for(let i=0;i<255;i++){EXP[i]=x;LOG[x]=i;x<<=1;if(x&256)x^=0x11d}for(let i=255;i<512;i++)EXP[i]=EXP[i-255];
  const mul=(a,b)=>a&&b?EXP[LOG[a]+LOG[b]]:0;
  let g=[1];for(let i=0;i<V.e;i++){const ng=new Array(g.length+1).fill(0);for(let j=0;j<g.length;j++){ng[j]^=g[j];ng[j+1]^=mul(g[j],EXP[i])}g=ng}
  const rs=blk=>{const r=blk.concat(new Array(V.e).fill(0));for(let i=0;i<blk.length;i++){const c=r[i];if(c)for(let j=0;j<g.length;j++)r[i+j]^=mul(g[j],c)}return r.slice(blk.length)};
  const blocks=[],ecs=[];for(let b=0;b<V.b;b++){const bl=cw.slice(b*V.d,(b+1)*V.d);blocks.push(bl);ecs.push(rs(bl))}
  const fin=[];for(let i=0;i<V.d;i++)blocks.forEach(b=>fin.push(b[i]));for(let i=0;i<V.e;i++)ecs.forEach(e=>fin.push(e[i]));
  const fb=[];fin.forEach(b=>{for(let i=7;i>=0;i--)fb.push((b>>i)&1)});
  // المصفوفة
  const M=[],F=[];for(let i=0;i<n;i++){M.push(new Array(n).fill(0));F.push(new Array(n).fill(false))}
  const set=(r,c,v)=>{if(r>=0&&c>=0&&r<n&&c<n){M[r][c]=v?1:0;F[r][c]=true}};
  const finder=(r,c)=>{for(let i=-1;i<=7;i++)for(let j=-1;j<=7;j++){const on=i>=0&&i<=6&&j>=0&&j<=6&&(i==0||i==6||j==0||j==6||(i>=2&&i<=4&&j>=2&&j<=4));set(r+i,c+j,on)}};

    case "all": html=`<div class="backbar"><h2>🛒 جميع المنتجات</h2></div>`+listView(ALL); break;
    case "deals": html=`<div class="backbar"><h2>⚡ العروض</h2></div>`+listView(ALL.filter(p=>disc(p)>=5)); break;
    case "cart": html=cartView(); nv="n-cart"; break;
    case "favs": {const s=saved();html=`<div class="backbar"><h2>♥ المفضلة</h2></div>`+(s.length?listView(ALL.filter(p=>s.includes(p.id))):`<div class="empty">اضغط ♥ على أي منتج لحفظه هنا</div>`);nv="n-favs";break}
    case "search": {const q=norm(view.q);html=`<div class="backbar"><h2>نتائج: ${esc(view.q)}</h2></div>`+(()=>{const r=ALL.filter(p=>norm(p.title+" "+p.desc+" "+((CATS.find(c=>c.id===p.cat)||{}).name||"")).includes(q));return r.length?listView(r):`<div class="empty">ما لقينا نتائج لـ «${esc(view.q)}»<br>جرّب كلمة ثانية أو تصفّح الأقسام</div>`})();break}
    case "orders": html=ordersView(); nv="n-account"; if(Date.now()-trkAt>8000){trkAt=Date.now();setTimeout(trackOrders,0)} break;
    case "account": html=accountView(); nv="n-account"; break;
    case "prof": html=profView(); nv="n-account"; break;
    case "sett": html=settView(); nv="n-account"; break;
    case "help": html=helpView(); nv="n-account"; break;
    case "faq": html=faqView(); nv="n-account"; break;
    case "inq": html=inqView(); nv="n-account"; break;
    case "cmp": html=cmpView(); nv="n-account"; break;
    case "chat": html=chatView(); nv="n-account"; setTimeout(chStart,0); break;
    case "me": html=`<div class="backbar"><h2>💬 تواصل معنا</h2></div><div class="me">${S.whatsapp?`<a href="https://wa.me/${esc(S.whatsapp)}" target="_blank" rel="noopener">💬 راسلنا على واتساب</a>`:""}<div class="li">🛍️ ${esc(S.name)}</div></div>`; nv="n-account"; break;
    default: html=home();
  }
  app.innerHTML=html; drawChips(); drawBadges();
  document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("on",b.id===nv));
  {const dm={"n-home":"d-home","n-cats":"d-cats","n-cart":"d-cart","n-favs":"d-favs"};const dv=view.name==="orders"?"d-orders":nv==="n-account"?"d-account":dm[nv];document.querySelectorAll(".dnav button").forEach(b=>b.classList.toggle("on",b.id===dv));app.dataset.v=view.name}
  if(view.name==="home"){let i=0;const sl=$("#slides"),ds=[...document.querySelectorAll("#dots i")],n=sl.children.length;if(n<2)return;slideT=setInterval(()=>{if(!sl.isConnected)return;i=(i+1)%n;sl.style.transform=`translateX(${-i*100}%)`;ds.forEach((d,k)=>d.classList.toggle("on",k===i))},3800)}
}
function nav(v,push=true){closePage();view=v;if(push)history.pushState(v,"");render();scrollTo(0,0)}
document.addEventListener("click",e=>{
  if(e.target.closest("[data-pgclose]")){history.back();return}
  const g=e.target.closest("[data-go]"); if(g){$("#q").value="";nav({name:g.dataset.go});return}
  const a=e.target.closest("[data-act]"); if(!a) return;
  const act=a.dataset.act,id=a.dataset.id;
  if(act==="fav"){e.stopPropagation();let s=saved();if(s.includes(id)){s=s.filter(x=>x!==id);a.classList.remove("on");toast("أُزيل من المفضلة")}else{s.push(id);a.classList.add("on");toast("أُضيف للمفضلة ♥")}LS.set("hs_saved",s);if($("#pg").classList.contains("show"))a.style.color=s.includes(id)?"var(--hot)":"#b5aa9a"}
  else if(act==="open") openPage(id);
  else if(act==="add"){e.stopPropagation();addToCart(id)}
  else if(act==="cat") nav({name:"cat",id});
  else if(act==="sort"){SORT=id;const y=scrollY;render();scrollTo(0,y)}
  else if(act==="clear"){if(confirm("تفريغ السلة؟")){CART=[];saveCart();render()}}
  else if(act==="share") shareP(id);
  else if(act==="inc"){CART.find(i=>(i.k||i.id)===a.dataset.k).q++;saveCart();render()}
  else if(act==="dec"){const it=CART.find(i=>(i.k||i.id)===a.dataset.k);it.q=Math.max(1,it.q-1);saveCart();render()}
  else if(act==="rm"){CART=CART.filter(i=>(i.k||i.id)!==a.dataset.k);saveCart();render()}
  else if(act==="cpn") applyCoupon(($("#c-cpn")||{}).value);
  else if(act==="checkout") checkout(CART.map(i=>({p:byId.get(i.id),q:i.q,sel:i.sel})).filter(x=>x.p));
});
window.addEventListener("popstate",e=>{ if($("#pg").classList.contains("show")){closePage();return} view=e.state||{name:"home"};render()});
history.replaceState({name:"home"},"");
let t;$("#q").addEventListener("input",e=>{clearTimeout(t);const v=e.target.value.trim();t=setTimeout(()=>{if(v)nav({name:"search",q:v},view.name!=="search");else if(view.name==="search")nav({name:"home"})},250)});
if("serviceWorker" in navigator) addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
(function(){
  let seen=false;try{seen=sessionStorage.getItem("hs_w")==="1"}catch(e){}
  const w=$("#wlc");
  if(seen||/[#&]p=/.test(location.hash)) return;
  w.style.display="flex";
  const go=()=>{w.classList.add("out");setTimeout(()=>w.remove(),500);try{sessionStorage.setItem("hs_w","1")}catch(e){}};
  $("#wgo").onclick=go;
})();
setInterval(()=>{if(!document.hidden&&(view.name==="orders"||LS.get("hs_orders",[]).length)){trkAt=Date.now();trackOrders()}},30000);
setTimeout(()=>{if(LS.get("hs_orders",[]).length)trackOrders()},1500);
boot();
</script>
