<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3b2410">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="حضرم شوب">
<title>حضرم شوب</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--deep:#241406;--brown:#3a2210;--brown2:#52301a;--gold:#f0b13a;--gold2:#ffd27a;--gold3:#c98a1a;--cream:#fbf4e8;--bg:#f6efe4;--ink:#241406;--muted:#8a7a68;--line:#eadfce;--hot:#d92d20;--wa:#25d366;--sh:0 4px 16px rgba(36,20,6,.10)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Cairo",system-ui,sans-serif}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom));min-height:100vh}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
img{max-width:100%;display:block}
.wrap{max-width:560px;margin:0 auto}
svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.top{position:sticky;top:0;z-index:30;background:linear-gradient(180deg,var(--deep),var(--brown));color:#fff;padding-top:env(safe-area-inset-top);box-shadow:0 4px 16px rgba(0,0,0,.3)}
.bar{display:flex;align-items:center;gap:10px;padding:10px 12px 8px}
.logo{display:flex;align-items:center;gap:8px;font-weight:900;font-size:20px;color:var(--gold2);white-space:nowrap;cursor:pointer}
.logo img{width:36px;height:36px;border-radius:10px;box-shadow:0 0 0 1.5px var(--gold)}
.search{flex:1;display:flex;align-items:center;gap:6px;background:#fff;border-radius:999px;padding:1px 14px;color:var(--ink);min-width:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.05)}
.search input{flex:1;border:0;outline:0;font:inherit;font-size:14px;background:none;padding:9px 0;min-width:0}
.search svg{width:19px;height:19px;color:var(--brown)}
.cartbtn{position:relative;width:40px;height:40px;display:grid;place-items:center;color:#fff}
.cnt{position:absolute;top:-1px;left:-3px;min-width:19px;height:19px;border-radius:999px;background:var(--hot);color:#fff;font-weight:900;font-size:11px;display:grid;place-items:center;padding:0 4px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 12px 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.22);font-weight:800;font-size:13px;color:#fff;white-space:nowrap;background:rgba(255,255,255,.05)}
.chip.on{background:linear-gradient(180deg,var(--gold2),var(--gold));border-color:var(--gold);color:var(--deep)}
main{padding:0 0 10px}
.hero{position:relative;margin:12px 12px 0;border-radius:20px;overflow:hidden;box-shadow:var(--sh);border:1px solid rgba(240,177,58,.55)}
.slides{display:flex;transition:transform .5s ease;direction:ltr}
.slide{min-width:100%;direction:rtl;min-height:190px;display:flex;align-items:stretch;color:#fff;position:relative;background:linear-gradient(110deg,#1c0f04,#4a2b12 60%,#7a4a1c)}
.slide .tx{flex:1;padding:18px 16px;display:flex;flex-direction:column;justify-content:center;gap:8px;z-index:1}
.slide h3{margin:0;font-size:24px;font-weight:900;line-height:1.3;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.4)}
.slide p{margin:0;font-size:13px;opacity:.92}
.slide .cta{align-self:flex-start;background:linear-gradient(180deg,var(--gold2),var(--gold));color:var(--deep);font-weight:900;border-radius:999px;padding:9px 22px;font-size:14.5px;box-shadow:0 4px 12px rgba(0,0,0,.35)}
.slide .im{width:46%;position:relative;overflow:hidden}
.slide .im img{width:100%;height:100%;object-fit:cover;-webkit-mask-image:linear-gradient(to left,#000 70%,transparent);mask-image:linear-gradient(to left,#000 70%,transparent)}
.slide .em{width:46%;display:grid;place-items:center;font-size:86px}
.slide .off{position:absolute;top:12px;left:12px;background:radial-gradient(circle,#e23a2c,#b3180f);color:#fff;width:68px;height:68px;border-radius:50%;display:grid;place-items:center;text-align:center;font-weight:900;font-size:19px;line-height:1.05;box-shadow:0 0 0 3px var(--gold2),0 6px 14px rgba(0,0,0,.4);z-index:2}
.slide .off small{display:block;font-size:11px}
.dots{position:absolute;bottom:8px;right:0;left:0;display:flex;justify-content:center;gap:6px;z-index:2}
.dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.5)}
.dots i.on{background:var(--gold2);width:18px;border-radius:5px}
.perks{display:grid;grid-template-columns:repeat(4,1fr);margin:12px 12px 0;background:#fff;border-radius:16px;padding:10px 2px;box-shadow:var(--sh);border:1px solid var(--line)}
.perks div{text-align:center;font-size:11px;font-weight:800;line-height:1.35;padding:0 3px;border-left:1px solid var(--line)}
.perks div:last-child{border-left:0}
.perks i{display:block;font-style:normal;font-size:21px;margin-bottom:2px}
.sec{margin-top:16px;padding:0 12px}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin:0 2px 10px}
.sec-h h3{margin:0;font-size:20px;font-weight:900;display:flex;align-items:center;gap:6px}
.sec-h button{color:var(--gold3);font-weight:800;font-size:13px}
.sub{margin:-8px 2px 10px;color:var(--muted);font-size:13px;font-weight:600}
.tiles{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}
.tiles::-webkit-scrollbar{display:none}
.tile{flex:0 0 auto;width:92px;text-align:center;background:linear-gradient(180deg,#fff,var(--cream));border:1px solid var(--line);border-radius:16px;padding:12px 4px 10px;box-shadow:var(--sh)}
.tile .ic{font-size:32px;height:64px;display:grid;place-items:center}
.tile .ic.hasimg img{width:64px;height:64px;object-fit:cover;border-radius:14px;box-shadow:0 3px 8px rgba(36,20,6,.2)}
.tile b{font-size:12.5px;font-weight:800;display:block;line-height:1.3;margin-top:4px}
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:10px 12px}
.cgrid .tile{width:auto}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:0 12px}
.pc{background:#fff;border-radius:16px;overflow:hidden;box-shadow:var(--sh);display:flex;flex-direction:column;border:1px solid var(--line)}
.pimg{position:relative;aspect-ratio:1/1;background:#f1ece3;cursor:pointer;display:grid;place-items:center}
.pimg img{width:100%;height:100%;object-fit:cover}
.tag{position:absolute;top:8px;right:8px;background:linear-gradient(180deg,#e8473a,#c4251a);color:#fff;font-weight:900;font-size:12px;line-height:1.1;padding:5px 9px;border-radius:9px;text-align:center}
.fav{position:absolute;top:8px;left:8px;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.95);display:grid;place-items:center;font-size:17px;color:#9b8f80;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.fav.on{color:var(--hot)}
.sold{position:absolute;inset:0;background:rgba(255,255,255,.72);display:grid;place-items:center;font-weight:900;color:var(--hot)}
.pb{padding:9px 10px 11px;display:flex;flex-direction:column;gap:6px;flex:1}
.pt{font-size:13.5px;font-weight:800;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:39px}
.pr{display:flex;flex-direction:column;align-items:flex-start;gap:0;min-height:44px}
.pr b{font-size:18px;font-weight:900;color:var(--brown);white-space:nowrap;line-height:1.25}
.pr s{line-height:1.2}
.pr s{font-size:12px;color:var(--muted)}
.addw{margin-top:auto;display:flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(180deg,var(--brown2),var(--deep));color:var(--gold2);font-weight:800;border-radius:12px;padding:10px 6px;font-size:13.5px;box-shadow:0 3px 8px rgba(36,20,6,.3)}
.addw svg{width:19px;height:19px}
.addw:active{transform:scale(.97)}
.empty{text-align:center;color:var(--muted);padding:34px 12px;font-weight:700}
.backbar{display:flex;align-items:center;gap:8px;padding:14px 14px 8px}
.backbar h2{margin:0;font-size:19px;font-weight:900}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:40;background:linear-gradient(180deg,var(--brown),var(--deep));border-radius:22px 22px 0 0;padding:8px 8px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -6px 22px rgba(0,0,0,.3);border-top:1px solid rgba(240,177,58,.4)}
.nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.nav button{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:800;color:#d9c7ad;padding:7px 0;border-radius:16px}
.nav button svg{width:23px;height:23px}
.nav button.on{color:var(--deep);background:linear-gradient(180deg,var(--gold2),var(--gold));box-shadow:0 4px 12px rgba(240,177,58,.4)}
.nav .nb{position:absolute;top:1px;left:50%;margin-left:8px;min-width:18px;height:18px;border-radius:999px;background:var(--hot);color:#fff;font-size:10.5px;font-weight:900;display:grid;place-items:center;padding:0 4px}
.pg{position:fixed;inset:0;z-index:70;background:#fff;overflow:auto;display:none;padding-bottom:calc(86px + env(safe-area-inset-bottom))}
.pg.show{display:block}
.pg .hd{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 12px 0;pointer-events:none}
.pg .hd button{pointer-events:auto;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.95);box-shadow:var(--sh);font-size:20px;display:grid;place-items:center}
.pg img.big{width:100%;max-width:560px;margin:-50px auto 0;aspect-ratio:1/1;object-fit:cover;background:#f1ece3}
.pg .bd{max-width:560px;margin:0 auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.pg .price{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.pg .price b{font-size:28px;font-weight:900;color:var(--brown)}
.pg .price s{color:var(--muted)}
.pg .price .off{background:var(--hot);color:#fff;font-weight:900;border-radius:6px;padding:2px 8px;font-size:13px}
.pg h3{margin:0;font-size:18px;line-height:1.5}
.pg p{margin:0;color:var(--muted);line-height:1.9;white-space:pre-wrap}
.qty{display:flex;align-items:center;gap:14px;font-weight:800}
.qb{width:36px;height:36px;border-radius:50%;background:var(--cream);font-size:20px;font-weight:900;border:1px solid var(--line)}
.actbar{position:fixed;bottom:0;left:0;right:0;z-index:3;background:#fff;border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;max-width:560px;margin:0 auto}
.btn{flex:1;border-radius:12px;padding:13px 8px;font-weight:900;font-size:15px}
.btn.cart{background:linear-gradient(180deg,var(--brown2),var(--deep));color:var(--gold2)}
.btn.buy{background:linear-gradient(180deg,var(--gold2),var(--gold));color:var(--deep)}
.btn.wa{background:var(--wa);color:#fff}
.btn.wide{width:100%;flex:none;display:block;text-align:center}
.ci{display:flex;gap:10px;background:#fff;border-radius:14px;padding:8px;margin:0 12px 8px;box-shadow:var(--sh);border:1px solid var(--line)}
.ci img{width:76px;height:76px;border-radius:10px;object-fit:cover;background:#f1ece3;flex:0 0 auto}
.ci .tt{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}
.ci .tt b{font-size:13.5px;line-height:1.4}
.ci .tt .p{font-weight:900;color:var(--brown)}
.ci .ctl{display:flex;align-items:center;justify-content:space-between}
.ci .qty .qb{width:30px;height:30px;font-size:17px}
.rm{color:var(--muted);font-size:13px;font-weight:800}
.sum{margin:10px 12px;background:#fff;border-radius:14px;padding:12px 14px;box-shadow:var(--sh);border:1px solid var(--line)}
.sum .ln{display:flex;justify-content:space-between;padding:6px 0;font-weight:800;font-size:18px}
.frm{margin:10px 12px;background:#fff;border-radius:14px;padding:12px 14px;box-shadow:var(--sh);border:1px solid var(--line)}
.frm label{display:block;font-weight:800;font-size:13px;margin:8px 0 4px}
.frm input,.frm textarea{width:100%;font:inherit;font-size:15px;padding:10px;border:1px solid var(--line);border-radius:10px}
.me a,.me .li{display:flex;align-items:center;gap:10px;padding:14px;border-bottom:1px solid var(--line);font-weight:800;color:inherit;text-decoration:none;background:#fff}
.toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--deep);color:var(--gold2);padding:10px 18px;border-radius:999px;font-weight:800;font-size:14px;opacity:0;pointer-events:none;transition:.3s;z-index:95;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@keyframes bump{50%{transform:scale(1.35)}}
.bump{animation:bump .35s}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="bar">
    <div class="logo" data-go="home"><img src="icon-192.png" alt=""><span id="shopName">حضرم شوب</span></div>
    <div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" type="search" placeholder="ابحث عن منتج..." autocomplete="off"></div>
    <button class="cartbtn" data-go="cart" aria-label="السلة"><svg viewBox="0 0 24 24"><path d="M3 4h2l2.4 11.2a2 2 0 002 1.6h7.4a2 2 0 002-1.5L20.5 8H6"/><circle cx="10" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/></svg><span class="cnt" id="cartCnt" style="display:none">0</span></button>
  </div>
  <div class="chips" id="chips"></div>
</div></header>
<main class="wrap" id="app"></main>
<nav class="nav"><div class="in">
  <button data-go="home" id="n-home"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>الرئيسية</button>
  <button data-go="cats" id="n-cats"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>الأقسام</button>
  <button data-go="cart" id="n-cart"><svg viewBox="0 0 24 24"><path d="M3 4h2l2.4 11.2a2 2 0 002 1.6h7.4a2 2 0 002-1.5L20.5 8H6"/><circle cx="10" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/></svg>السلة<span class="nb" id="navCnt" style="display:none">0</span></button>
  <button data-go="favs" id="n-favs"><svg viewBox="0 0 24 24"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 018-2.7A4.5 4.5 0 0120 10c0 5.8-8 11-8 11z"/></svg>المفضلة</button>
  <button data-go="me" id="n-me"><svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 01-11.6 7.1L4 20l1-4.6A8 8 0 1121 12z"/></svg>تواصل</button>
</div></nav>
<div class="pg" id="pg"></div>
<div class="toast" id="toast"></div>
<script>
const $=(s,r=document)=>r.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nf=n=>(Math.round(n*100)/100).toLocaleString("en-US",{maximumFractionDigits:2});
const safeUrl=u=>(/^\s*(javascript|vbscript):/i.test(String(u||""))?"":String(u||""));
const norm=t=>String(t||"").toLowerCase().replace(/[ً-ٰٟـ]/g,"").replace(/[أإآ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه");
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const toast=t=>{const el=$("#toast");el.textContent=t;el.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove("show"),1700)};
const ICON_CART2='<svg viewBox="0 0 24 24"><path d="M3 4h2l2.4 11.2a2 2 0 002 1.6h7.4a2 2 0 002-1.5L20.5 8H6"/><circle cx="10" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/></svg>';

let S={name:"حضرم شوب",tagline:"منتجات مختارة بأسعار مميزة",whatsapp:"",currency:"ر.س"}, CATS=[], ALL=[], byId=new Map();
let view={name:"home"}, slideT=null;
const app=$("#app");
const saved=()=>LS.get("hs_saved",[]);
let CART=LS.get("hs_cart",[]); // [{id,q}]
const saveCart=()=>{LS.set("hs_cart",CART);drawBadges()};

async function load(){
  try{
    const r=await fetch("products.json?v="+Math.floor(Date.now()/30000),{cache:"no-store"});
    const d=await r.json();
    S={...S,...(d.settings||{})}; CATS=d.categories||[];
    ALL=(d.products||[]).map(p=>({id:String(p.id),title:p.title||"منتج",price:parseFloat(p.price)||0,cur:p.currency==="YER"?"ر.ي":"ر.س",old:parseFloat(p.old)||0,image:p.image||"",cat:p.category||"",desc:p.desc||"",stock:p.stock!==false,created:Date.parse(p.createdAt)||0}))
      .filter(p=>p.price>0).sort((a,b)=>b.created-a.created);
    byId=new Map(ALL.map(x=>[x.id,x]));
    CART=CART.filter(i=>byId.has(i.id));
  }catch(e){console.error(e)}
  $("#shopName").textContent=S.name; document.title=S.name;
}
const disc=p=>p.old>p.price?Math.round((1-p.price/p.old)*100):0;
function drawBadges(){
  const n=CART.reduce((a,i)=>a+i.q,0);
  for(const id of ["cartCnt","navCnt"]){const el=$("#"+id);el.style.display=n?"grid":"none";el.textContent=n}
}
function addToCart(id,q=1,quiet){
  const p=byId.get(id); if(!p||!p.stock) return;
  const it=CART.find(i=>i.id===id); if(it) it.q+=q; else CART.push({id,q});
  saveCart();
  const c=$("#cartCnt");c.classList.remove("bump");void c.offsetWidth;c.classList.add("bump");
  if(!quiet) toast("أُضيف إلى السلة 🛒");
}
function card(p){
  const d=disc(p), fav=saved().includes(p.id);
  return `<article class="pc"><div class="pimg" data-act="open" data-id="${esc(p.id)}">
    ${p.image?`<img loading="lazy" src="${esc(safeUrl(p.image))}" alt="${esc(p.title)}">`:"🛍️"}
    ${d>=5?`<span class="tag">خصم<br>${d}%</span>`:""}${p.stock?"":`<div class="sold">نفد المخزون</div>`}
    <button class="fav ${fav?"on":""}" data-act="fav" data-id="${esc(p.id)}">♥</button></div>
    <div class="pb"><div class="pt">${esc(p.title)}</div>
    <div class="pr"><b>${nf(p.price)} ${esc(p.cur)}</b>${d?`<s>${nf(p.old)} ${esc(p.cur)}</s>`:""}</div>
    ${p.stock?`<button class="addw" data-act="add" data-id="${esc(p.id)}">أضف إلى السلة ${ICON_CART2}</button>`:""}</div></article>`;
}
const grid=a=>a.length?`<div class="grid">${a.map(card).join("")}</div>`:`<div class="empty">لا توجد منتجات هنا حالياً</div>`;
const catImg=c=>c.image||(ALL.find(p=>p.cat===c.id&&p.image)||{}).image||"";
const circ=c=>{const im=catImg(c);return `<button class="tile" data-act="cat" data-id="${esc(c.id)}"><div class="ic ${im?"hasimg":""}">${im?`<img loading="lazy" src="${esc(safeUrl(im))}" alt="">`:esc(c.emoji||"🛍️")}</div><b>${esc(c.name)}</b></button>`}
function mini(p){return `<div class="mini" data-act="open" data-id="${esc(p.id)}"><span class="tag">-${disc(p)}%</span><div class="im">${p.image?`<img loading="lazy" src="${esc(safeUrl(p.image))}" alt="">`:""}</div><div class="pr">${nf(p.price)} ${esc(p.cur)}<s>${nf(p.old)} ${esc(p.cur)}</s></div></div>`}

function drawChips(){
  const cur=view.name==="cat"?view.id:(view.name==="home"?"":"__");
  $("#chips").innerHTML=`<button class="chip ${cur===""?"on":""}" data-go="home">الكل</button>`+CATS.map(c=>`<button class="chip ${cur===c.id?"on":""}" data-act="cat" data-id="${esc(c.id)}">${esc((c.emoji||"")+" "+c.name)}</button>`).join("");
}
function home(){
  const deals=ALL.filter(p=>disc(p)>=5&&p.stock).sort((a,b)=>disc(b)-disc(a));
  const feat=(ALL.filter(p=>p.image&&p.stock));
  const slides=[];
  feat.slice(0,3).forEach(p=>{const d=disc(p);slides.push(`<div class="slide">${d>=5?`<div class="off"><div>${d}%<small>خصم</small></div></div>`:""}<div class="tx"><h3>${esc(p.title.length>38?p.title.slice(0,38)+"…":p.title)}</h3><p>${nf(p.price)} ${esc(p.cur)}${d?` بدل ${nf(p.old)} ${esc(p.cur)}`:""}</p><button class="cta" data-act="open" data-id="${esc(p.id)}">تسوّق الآن ‹</button></div><div class="im"><img src="${esc(safeUrl(p.image))}" alt=""></div></div>`)});
  if(!slides.length) slides.push(`<div class="slide"><div class="tx"><h3>${esc(S.name)}</h3><p>${esc(S.tagline)}</p><button class="cta" data-go="all">تسوّق الآن ‹</button></div><div class="em">🛍️</div></div>`);
  return `<div class="hero"><div class="slides" id="slides">${slides.join("")}</div>${slides.length>1?`<div class="dots" id="dots">${slides.map((_,i)=>`<i class="${i?"":"on"}"></i>`).join("")}</div>`:""}</div>
  <div class="perks"><div><i>⚡</i>طلب سريع<br>عبر واتساب</div><div><i>💰</i>أسعار<br>مميزة</div><div><i>✅</i>منتجات<br>مختارة</div><div><i>💬</i>تواصل<br>مباشر</div></div>
  ${CATS.length?`<section class="sec"><div class="sec-h"><button data-go="cats">عرض الكل ‹</button><h3>تسوّق حسب القسم</h3></div><div class="tiles">${CATS.map(circ).join("")}</div></section>`:""}
  ${deals.length?`<section class="sec"><div class="sec-h"><button data-go="deals">عرض الكل ‹</button><h3>عروض اليوم 🔥</h3></div><div class="sub">أسعار مخفّضة على منتجات مختارة</div></section><div class="grid">${deals.slice(0,6).map(card).join("")}</div>`:""}
  <section class="sec"><div class="sec-h"><h3>🛒 جميع المنتجات <small style="color:var(--muted);font-size:13px">(${ALL.length})</small></h3></div></section>${grid(ALL)}`;
}
function cartView(){
  if(!CART.length) return `<div class="backbar"><h2>🛒 السلة</h2></div><div class="empty">سلتك فارغة<br><br><button class="btn buy" style="flex:none;padding:12px 26px" data-go="home">ابدأ التسوق</button></div>`;
  const items=CART.map(i=>({p:byId.get(i.id),q:i.q})).filter(x=>x.p);
  const tot={}; items.forEach(({p,q})=>tot[p.cur]=(tot[p.cur]||0)+p.price*q);
  const f=LS.get("hs_cust",{name:"",addr:"",note:""});
  return `<div class="backbar"><h2>🛒 السلة (${items.length})</h2></div>
  ${items.map(({p,q})=>`<div class="ci"><img src="${esc(safeUrl(p.image))}" alt=""><div class="tt"><b>${esc(p.title)}</b><span class="p">${nf(p.price)} ${esc(p.cur)}</span>
    <div class="ctl"><div class="qty"><button class="qb" data-act="dec" data-id="${esc(p.id)}">−</button><span>${q}</span><button class="qb" data-act="inc" data-id="${esc(p.id)}">+</button></div><button class="rm" data-act="rm" data-id="${esc(p.id)}">🗑 حذف</button></div></div></div>`).join("")}
  <div class="sum">${Object.entries(tot).map(([c,v])=>`<div class="ln t"><span>الإجمالي</span><span style="color:var(--hot)">${nf(v)} ${esc(c)}</span></div>`).join("")}</div>
  <div class="frm"><b>بيانات الطلب</b>
    <label>الاسم</label><input id="c-name" value="${esc(f.name)}" placeholder="اسمك">
    <label>العنوان / المدينة</label><input id="c-addr" value="${esc(f.addr)}" placeholder="المدينة والحي">
    <label>ملاحظات (اختياري)</label><textarea id="c-note" rows="2">${esc(f.note)}</textarea></div>
  <div style="padding:0 10px"><button class="btn wa wide" data-act="checkout">💬 إتمام الطلب عبر واتساب</button></div>`;
}
function checkout(items){
  if(!S.whatsapp){toast("رقم واتساب غير مضبوط");return}
  const cust={name:($("#c-name")||{}).value||"",addr:($("#c-addr")||{}).value||"",note:($("#c-note")||{}).value||""};
  if($("#c-name")) LS.set("hs_cust",cust); else Object.assign(cust,LS.get("hs_cust",{}));
  const tot={}; items.forEach(({p,q})=>tot[p.cur]=(tot[p.cur]||0)+p.price*q);
  let m=`السلام عليكم، أبغى أطلب من ${S.name}:\n\n`;
  items.forEach(({p,q},n)=>{m+=`${n+1}) ${p.title}\n   الكمية: ${q} × ${nf(p.price)} ${p.cur}\n`});
  m+=`\nالإجمالي: ${Object.entries(tot).map(([c,v])=>nf(v)+" "+c).join(" + ")}\n`;
  if(cust.name) m+=`\nالاسم: ${cust.name}`; if(cust.addr) m+=`\nالعنوان: ${cust.addr}`; if(cust.note) m+=`\nملاحظات: ${cust.note}`;
  window.open(`https://wa.me/${S.whatsapp}?text=${encodeURIComponent(m)}`,"_blank","noopener");
}
function openPage(id){
  const p=byId.get(id); if(!p) return; let q=1; const d=disc(p);
  const draw=()=>{ $("#pg").innerHTML=`<div class="hd"><button data-pgclose>›</button><button data-act="fav" data-id="${esc(p.id)}" class="${saved().includes(p.id)?"on":""}" style="color:${saved().includes(p.id)?"var(--hot)":"#b5aa9a"}">♥</button></div>
    ${p.image?`<img class="big" src="${esc(safeUrl(p.image))}" alt="">`:""}
    <div class="bd"><div class="price"><b>${nf(p.price)} ${esc(p.cur)}</b>${d?`<s>${nf(p.old)} ${esc(p.cur)}</s><span class="off">-${d}%</span>`:""}</div>
    <h3>${esc(p.title)}</h3>${p.desc?`<p>${esc(p.desc)}</p>`:""}
    ${p.stock?`<div class="qty">الكمية: <button class="qb" data-pq="-">−</button><span>${q}</span><button class="qb" data-pq="+">+</button></div>`:`<div class="empty">نفد المخزون</div>`}</div>
    ${p.stock?`<div class="actbar"><button class="btn cart" id="pAdd">🛒 أضف للسلة</button><button class="btn buy" id="pBuy">⚡ اشترِ الآن</button></div>`:""}`;
    $("#pg").querySelectorAll("[data-pq]").forEach(b=>b.onclick=()=>{q=Math.max(1,q+(b.dataset.pq==="+"?1:-1));draw()});
    const a=$("#pAdd"); if(a) a.onclick=()=>{addToCart(id,q);closePage()};
    const b=$("#pBuy"); if(b) b.onclick=()=>{ closePage(); CART=CART.filter(i=>i.id!==id); CART.unshift({id,q}); saveCart(); nav({name:"cart"}); };
  };
  draw(); $("#pg").classList.add("show"); $("#pg").scrollTop=0; history.pushState({...view,pg:1},"");
}
function closePage(back){ $("#pg").classList.remove("show"); }
function render(){
  clearInterval(slideT);
  let html="",nv="n-home";
  switch(view.name){
    case "cats": html=`<div class="backbar"><h2>🧩 الأقسام</h2></div><div class="cgrid">${CATS.map(circ).join("")}</div>`; nv="n-cats"; break;
    case "cat": {const c=CATS.find(x=>x.id===view.id)||{};html=`<div class="backbar"><h2>${esc((c.emoji||"")+" "+(c.name||""))}</h2></div>`+grid(ALL.filter(p=>p.cat===view.id));nv="n-cats";break}
    case "all": html=`<div class="backbar"><h2>🛒 جميع المنتجات</h2></div>`+grid(ALL); break;
    case "deals": html=`<div class="backbar"><h2>⚡ العروض</h2></div>`+grid(ALL.filter(p=>disc(p)>=5).sort((a,b)=>disc(b)-disc(a))); break;
    case "cart": html=cartView(); nv="n-cart"; break;
    case "favs": {const s=saved();html=`<div class="backbar"><h2>♥ المفضلة</h2></div>`+(s.length?grid(ALL.filter(p=>s.includes(p.id))):`<div class="empty">اضغط ♥ على أي منتج لحفظه هنا</div>`);nv="n-favs";break}
    case "search": {const q=norm(view.q);html=`<div class="backbar"><h2>نتائج: ${esc(view.q)}</h2></div>`+grid(ALL.filter(p=>norm(p.title+" "+p.desc).includes(q)));break}
    case "me": html=`<div class="backbar"><h2>💬 تواصل معنا</h2></div><div class="me">${S.whatsapp?`<a href="https://wa.me/${esc(S.whatsapp)}" target="_blank" rel="noopener">💬 راسلنا على واتساب</a>`:""}<div class="li">🛍️ ${esc(S.name)}</div></div>`; nv="n-me"; break;
    default: html=home();
  }
  app.innerHTML=html; drawChips(); drawBadges();
  document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("on",b.id===nv));
  if(view.name==="home"){let i=0;const sl=$("#slides"),ds=[...document.querySelectorAll("#dots i")],n=sl.children.length;if(n<2)return;slideT=setInterval(()=>{if(!sl.isConnected)return;i=(i+1)%n;sl.style.transform=`translateX(${-i*100}%)`;ds.forEach((d,k)=>d.classList.toggle("on",k===i))},3800)}
}
function nav(v,push=true){closePage();view=v;if(push)history.pushState(v,"");render();scrollTo(0,0)}
document.addEventListener("click",e=>{
  if(e.target.closest("[data-pgclose]")){history.back();return}
  const g=e.target.closest("[data-go]"); if(g){$("#q").value="";nav({name:g.dataset.go});return}
  const a=e.target.closest("[data-act]"); if(!a) return;
  const act=a.dataset.act,id=a.dataset.id;
  if(act==="fav"){e.stopPropagation();let s=saved();if(s.includes(id)){s=s.filter(x=>x!==id);a.classList.remove("on");toast("أُزيل من المفضلة")}else{s.push(id);a.classList.add("on");toast("أُضيف للمفضلة ♥")}LS.set("hs_saved",s);if($("#pg").classList.contains("show"))a.style.color=s.includes(id)?"var(--hot)":"#b5aa9a"}
  else if(act==="open") openPage(id);
  else if(act==="add"){e.stopPropagation();addToCart(id)}
  else if(act==="cat") nav({name:"cat",id});
  else if(act==="inc"){CART.find(i=>i.id===id).q++;saveCart();render()}
  else if(act==="dec"){const it=CART.find(i=>i.id===id);it.q=Math.max(1,it.q-1);saveCart();render()}
  else if(act==="rm"){CART=CART.filter(i=>i.id!==id);saveCart();render()}
  else if(act==="checkout") checkout(CART.map(i=>({p:byId.get(i.id),q:i.q})).filter(x=>x.p));
});
window.addEventListener("popstate",e=>{ if($("#pg").classList.contains("show")){closePage();return} view=e.state||{name:"home"};render()});
history.replaceState({name:"home"},"");
let t;$("#q").addEventListener("input",e=>{clearTimeout(t);const v=e.target.value.trim();t=setTimeout(()=>{if(v)nav({name:"search",q:v},view.name!=="search");else if(view.name==="search")nav({name:"home"})},250)});
if("serviceWorker" in navigator) addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
load().then(render);
</script>
</body>
</html>
