<style>
:root{--deep:#241406;--brown:#3a2210;--gold:#f0b13a;--gold2:#ffd27a;--bg:#f6efe4;--ink:#241406;--muted:#8a7a68;--line:#eadfce;--card:#fff;--hot:#d92d20;--wa:#25d366;
--new:#d92d20;--prep:#d98a06;--ship:#2563eb;--done:#12803c;--cancel:#8a7a68;--sh:0 3px 12px rgba(36,20,6,.09)}
@media (prefers-color-scheme:dark){:root{--bg:#171009;--ink:#f6efe4;--muted:#b3a28c;--line:#3a2a1a;--card:#241709}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Tajawal","Segoe UI",Tahoma,sans-serif}
button,input,select,textarea{font-family:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.wrap{max-width:640px;margin:0 auto;padding:0 12px calc(96px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,var(--deep),var(--brown));color:#fff;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;box-shadow:0 4px 14px rgba(0,0,0,.3)}
header .in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:10px}
header h1{margin:0;font-size:18px;font-weight:900;color:var(--gold2);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header a{color:#fff;text-decoration:none;font-weight:800;font-size:13px;background:rgba(255,255,255,.14);border-radius:999px;padding:6px 12px}
.auth{max-width:440px;margin:4vh auto 0;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--sh)}
.auth h2{margin:0 0 4px;font-size:21px}
.auth p{margin:0 0 12px;color:var(--muted);font-weight:700;font-size:13.5px}
.tabs2{display:flex;background:var(--bg);border-radius:12px;padding:4px;margin-bottom:12px}
.tabs2 button{flex:1;padding:9px;border-radius:9px;font-weight:900;color:var(--muted)}
.tabs2 button.on{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
label{display:block;font-weight:800;font-size:13px;margin:10px 0 4px}
input,select,textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:11px;font-size:15px}
textarea{min-height:90px;resize:vertical}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
.btn{display:block;width:100%;border-radius:12px;padding:13px;font-weight:900;font-size:16px;margin-top:14px;text-align:center;text-decoration:none}
.btn.gold{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#111}
.btn.dark{background:var(--brown);color:var(--gold2)}
.btn.red{background:#fdecea;color:var(--hot)}
.msg{margin-top:10px;font-weight:800;font-size:13.5px;min-height:18px}
.msg.err{color:var(--hot)}.msg.ok{color:var(--done)}
.chk{display:flex;gap:8px;align-items:flex-start;margin-top:12px;font-weight:700;font-size:13px}
.chk input{width:20px;height:20px;flex:0 0 auto;accent-color:#c98a1a;margin-top:2px}
.link{color:#a76a0c;font-weight:900;text-decoration:underline;cursor:pointer}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:linear-gradient(180deg,var(--brown),var(--deep));border-radius:20px 20px 0 0;padding:7px 8px calc(6px + env(safe-area-inset-bottom));display:flex;gap:4px;box-shadow:0 -6px 20px rgba(0,0,0,.3)}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11.5px;font-weight:800;color:#d9c7ad;padding:7px 0;border-radius:14px;position:relative}
.nav .tolink{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11.5px;font-weight:800;color:var(--gold2);padding:7px 0;border-radius:14px;text-decoration:none;border:1.5px solid rgba(240,177,58,.5)}
.nav .tolink b{font-size:19px;line-height:1.2}
.nav button b{font-size:19px;line-height:1.2}
.nav button.on{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#111}
.nav .nb{position:absolute;top:0;left:22%;background:var(--hot);color:#fff;font-size:10.5px;min-width:17px;height:17px;border-radius:99px;display:grid;place-items:center;padding:0 4px}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin:12px 0 10px}
.st{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:7px 1px;text-align:center;font-weight:800;font-size:10.5px;color:var(--muted)}
.st b{display:block;font-size:19px;font-weight:900;color:var(--ink);line-height:1.1}
.st i{display:block;width:20px;height:4px;border-radius:4px;margin:0 auto 4px}
.st.on{outline:2.5px solid var(--gold)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:10px;box-shadow:var(--sh);overflow:hidden;border-right:5px solid var(--c,var(--line))}

.tm{color:var(--muted);font-size:12px;font-weight:700;padding:0 12px}

.cust a{color:inherit;text-decoration:none;font-weight:800}
.it{display:flex;align-items:center;gap:10px;padding:5px 0;border-top:1px dashed var(--line)}
.it img,.it .ph{width:50px;height:50px;border-radius:10px;object-fit:cover;background:var(--bg);flex:0 0 auto;display:grid;place-items:center}

.tot{display:flex;justify-content:space-between;font-weight:900;font-size:16px;margin-top:4px}

.ship{padding:2px 12px 6px}

.act{display:flex;flex-wrap:wrap;gap:6px;padding:4px 12px 12px}
.act button,.act a{flex:1 1 auto;text-align:center;text-decoration:none;border-radius:10px;padding:9px 6px;font-weight:900;font-size:13px;background:var(--bg);border:1px solid var(--line);white-space:nowrap}
.act .go{background:var(--c);border-color:var(--c);color:#fff}

.pl{display:flex;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px;margin-bottom:8px;box-shadow:var(--sh);align-items:center}

.pl .t{flex:1;min-width:0;font-weight:800;font-size:14px;line-height:1.4}

.pl .b button{border-radius:8px;padding:5px 10px;font-weight:900;font-size:12px;background:var(--bg);border:1px solid var(--line)}
.sw{font-size:11.5px}.sw.off{color:var(--hot)}.sw.on{color:var(--done)}
.empty{text-align:center;color:var(--muted);font-weight:700;padding:34px 10px}
.fab{position:fixed;left:14px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:25;background:linear-gradient(180deg,var(--gold2),var(--gold));color:#111;font-weight:900;border-radius:999px;padding:13px 20px;box-shadow:0 6px 18px rgba(0,0,0,.3)}
.sheet{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center}

.sheet h3{margin:0 0 6px;font-size:19px}
.imgbox{display:grid;place-items:center;height:150px;border:2px dashed var(--line);border-radius:14px;background:var(--bg);overflow:hidden;color:var(--muted);font-weight:800;cursor:pointer}
.imgbox img{width:100%;height:100%;object-fit:cover}
.bankbox{border:1.5px solid var(--line);border-radius:14px;padding:4px 12px 12px;margin:12px 0;background:var(--bg)}.bankbox b{display:block;margin:8px 0 2px}
.earn{border:2px solid #d4a017;border-radius:14px;padding:10px 12px;margin:10px 0;background:#fff8e6;color:#2b1a08;font-weight:800;font-size:13.5px;line-height:1.9}.earn .ln{display:flex;justify-content:space-between}.earn .net{font-size:15.5px;color:#12803c;border-top:1px dashed #d4a017;margin-top:4px;padding-top:4px}.earn small{display:block;color:#7a6a50;font-weight:700;line-height:1.6;margin-top:4px}
.nobank{border:2px solid #d92d20;border-radius:14px;padding:12px;margin:10px 0;background:#fff1f0;font-weight:800}
.gal{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.gal .th{position:relative;width:78px;height:78px;border-radius:12px;overflow:hidden;border:2px solid var(--line);background:var(--bg)}
.gal .th.main{border-color:var(--gold,#d4a017)}
.gal .th img{width:100%;height:100%;object-fit:cover}
.gal .th button{position:absolute;top:2px;left:2px;border:0;background:#000a;color:#fff;border-radius:50%;width:22px;height:22px;font-size:13px;line-height:22px;padding:0}
.gal .th i{position:absolute;bottom:0;right:0;left:0;background:#d4a017;color:#000;font-size:10px;font-weight:900;text-align:center;font-style:normal}
.gal .th u{position:absolute;bottom:0;right:0;left:0;background:#000a;color:#fff;font-size:10px;text-align:center;text-decoration:none;cursor:pointer}
.gal .add{display:grid;place-items:center;width:78px;height:78px;border:2px dashed var(--line);border-radius:12px;color:var(--muted);font-weight:900;font-size:26px;cursor:pointer;background:none}
.og{border:1px solid var(--line);border-radius:12px;padding:8px;margin-bottom:8px;background:var(--bg)}
.og .oh{display:flex;gap:6px;margin-bottom:6px}.og .oh input{flex:1}
.og .oh button{border:0;background:#c0392b;color:#fff;border-radius:10px;padding:0 12px;font-weight:900}
.chs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chs button{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:6px 11px;font-weight:800;font-size:13px;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:5px}
.chs button.on{background:#2b1a08;color:#fff;border-color:#2b1a08}
.chs .dot{width:12px;height:12px;border-radius:50%;border:1px solid #0003;display:inline-block}
.av{display:flex;gap:6px}.av input{flex:1}.av button{border:0;background:#d4a017;color:#000;border-radius:10px;padding:0 14px;font-weight:900}
.pre{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.pre button{border:1px solid var(--line);background:var(--bg);border-radius:20px;padding:6px 12px;font-weight:800;font-size:13px;cursor:pointer}
.terms{white-space:pre-wrap;line-height:1.9;font-size:14px;font-weight:600}
.profile .kv{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line);font-weight:800}
.profile .kv span:first-child{color:var(--muted)}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--deep);color:var(--gold2);padding:9px 18px;border-radius:999px;font-weight:800;font-size:14px;z-index:90;opacity:0;pointer-events:none;transition:.3s}
.toast.show{opacity:1}

const $=(s,r=document)=>r.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:v}catch{return d}},set(k,v){try{localStorage.setItem(k,v)}catch{}},del(k){try{localStorage.removeItem(k)}catch{}}};
const nf=n=>(Math.round(n*100)/100).toLocaleString("en-US");
const toast=t=>{const el=$("#toast");el.textContent=t;el.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove("show"),1900)};
const ST={new:["جديد","var(--new)"],prep:["قيد التجهيز","var(--prep)"],ship:["في الطريق","var(--ship)"],done:["تم التوصيل","var(--done)"],cancel:["ملغي","var(--cancel)"]};
const SHOP="وفر";
let API="https://hadhram-bot.aasa2841996.workers.dev", TK=LS.get("hm_tk",""), ME=null, CATS=[];
let BAL=null, tab="orders", ofilter="new", oq="", orders=[], ocounts={}, omore=false, prods=[], sel=null, maxId=0, timer=null, mode="login";

function bankFields(p,v){
  v=v||{};const t=v.acct_type||"";

const TERMS=`شروط وأحكام التاجر في ${SHOP}

1) العمولة: تُقتطع للمنصة عمولة على كل عملية بيع مكتملة بالنسبة المحددة في حسابك (تظهر في صفحة «حسابي»). تُحسب على سعر المنتجات دون رسوم الشحن، وتُخصم من مستحقاتك.

بالتسجيل فأنت تقرّ بقراءة هذه الشروط والموافقة عليها.`;

async function api(path,opt={}){
  const h={...(TK?{"x-token":TK}:{}),...(opt.body?{"content-type":"application/json"}:{})};
  const r=await fetch(API+path,{...opt,headers:h});
  const j=await r.json().catch(()=>({}));
  if(r.status===401&&TK){TK="";LS.del("hm_tk");authView();throw new Error("انتهت الجلسة، سجّل الدخول")}
  if(!r.ok){const e=new Error(j.error||("خطأ "+r.status));e.status=r.status;throw e}
  return j;
}

/* مولّد QR صغير (بايتات ASCII، تصحيح M، الإصدارات 1–4) */
function wfrQR(text){
  const data=Array.from(unescape(encodeURIComponent(String(text))),c=>c.charCodeAt(0));
  const VS=[null,{n:21,d:16,e:10,b:1},{n:25,d:28,e:16,b:1},{n:29,d:44,e:26,b:1},{n:33,d:32,e:18,b:2}];
  let ver=0;for(let v=1;v<=4;v++){if(data.length<=VS[v].d*VS[v].b-2){ver=v;break}}
  if(!ver)return null;
  const V=VS[ver],n=V.n,total=V.d*V.b;
  // بتات البيانات
  const bits=[];const put=(val,len)=>{for(let i=len-1;i>=0;i--)bits.push((val>>i)&1)};
  put(4,4);put(data.length,8);data.forEach(b=>put(b,8));
  for(let i=0;i<4&&bits.length<total*8;i++)bits.push(0);
  while(bits.length%8)bits.push(0);
  const cw=[];for(let i=0;i<bits.length;i+=8){let x=0;for(let j=0;j<8;j++)x=x<<1|bits[i+j];cw.push(x)}
  for(let p=0;cw.length<total;p++)cw.push(p%2?0x11:0xEC);
  // GF(256)
  const EXP=new Array(512),LOG=new Array(256);let x=1;for(let i=0;i<255;i++){EXP[i]=x;LOG[x]=i;x<<=1;if(x&256)x^=0x11d}for(let i=255;i<512;i++)EXP[i]=EXP[i-255];
  const mul=(a,b)=>a&&b?EXP[LOG[a]+LOG[b]]:0;
  let g=[1];for(let i=0;i<V.e;i++){const ng=new Array(g.length+1).fill(0);for(let j=0;j<g.length;j++){ng[j]^=g[j];ng[j+1]^=mul(g[j],EXP[i])}g=ng}
  const rs=blk=>{const r=blk.concat(new Array(V.e).fill(0));for(let i=0;i<blk.length;i++){const c=r[i];if(c)for(let j=0;j<g.length;j++)r[i+j]^=mul(g[j],c)}return r.slice(blk.length)};
  const blocks=[],ecs=[];for(let b=0;b<V.b;b++){const bl=cw.slice(b*V.d,(b+1)*V.d);blocks.push(bl);ecs.push(rs(bl))}
  const fin=[];for(let i=0;i<V.d;i++)blocks.forEach(b=>fin.push(b[i]));for(let i=0;i<V.e;i++)ecs.forEach(e=>fin.push(e[i]));
  const fb=[];fin.forEach(b=>{for(let i=7;i>=0;i--)fb.push((b>>i)&1)});
  // المصفوفة
  const M=[],F=[];for(let i=0;i<n;i++){M.push(new Array(n).fill(0));F.push(new Array(n).fill(false))}
  const set=(r,c,v)=>{if(r>=0&&c>=0&&r<n&&c<n){M[r][c]=v?1:0;F[r][c]=true}};
  const finder=(r,c)=>{for(let i=-1;i<=7;i++)for(let j=-1;j<=7;j++){const on=i>=0&&i<=6&&j>=0&&j<=6&&(i==0||i==6||j==0||j==6||(i>=2&&i<=4&&j>=2&&j<=4));set(r+i,c+j,on)}};
  finder(0,0);finder(0,n-7);finder(n-7,0);
  for(let i=8;i<n-8;i++){set(6,i,i%2==0);set(i,6,i%2==0)}
  if(ver>=2){const p=n-7;for(let i=-2;i<=2;i++)for(let j=-2;j<=2;j++)set(p+i,p+j,Math.max(Math.abs(i),Math.abs(j))!=1)}
  set(n-8,8,1);
  // مناطق معلومات الصيغة محجوزة
  const resv=[];for(let i=0;i<9;i++){resv.push([8,i],[i,8])}for(let i=0;i<8;i++){resv.push([8,n-1-i],[n-1-i,8])}
  resv.forEach(([r,c])=>{if(!F[r][c]){F[r][c]=true;M[r][c]=0}});
  M[n-8][8]=1;
  // وضع البيانات
  const dpos=[];let up=true;for(let c=n-1;c>0;c-=2){if(c==6)c--;for(let k=0;k<n;k++){const r=up?n-1-k:k;for(let d=0;d<2;d++){const cc=c-d;if(!F[r][cc])dpos.push([r,cc])}}up=!up}
  const masks=[(i,j)=>(i+j)%2==0,(i,j)=>i%2==0,(i,j)=>j%3==0,(i,j)=>(i+j)%3==0,(i,j)=>(Math.floor(i/2)+Math.floor(j/3))%2==0,(i,j)=>(i*j)%2+(i*j)%3==0,(i,j)=>((i*j)%2+(i*j)%3)%2==0,(i,j)=>((i+j)%2+(i*j)%3)%2==0];
  const bch=(d)=>{let v=d<<10;for(let i=14;i>=10;i--)if((v>>i)&1)v^=0x537<<(i-10);return((d<<10)|v)^0x5412};
  const build=m=>{
    const A=M.map(r=>r.slice());
    dpos.forEach(([r,c],i)=>{let b=i<fb.length?fb[i]:0;if(masks[m](r,c))b^=1;A[r][c]=b});
    const f=bch((0<<3)|m); // M = 00
    for(let i=0;i<15;i++){const v=(f>>i)&1;

      if(i<8)A[8][n-1-i]=v;else if(i<9)A[8][15-i]=v;else A[8][15-i-1]=v}
    A[n-8][8]=1;return A};
  const pen=A=>{let s=0;
    for(let t=0;t<2;t++){for(let i=0;i<n;i++){let run=1;for(let j=1;j<n;j++){const a=t?A[j][i]:A[i][j],b=t?A[j-1][i]:A[i][j-1];if(a==b){run++;if(j==n-1&&run>=5)s+=run-2}else{if(run>=5)s+=run-2;run=1}}}}
    for(let i=0;i<n-1;i++)for(let j=0;j<n-1;j++){const v=A[i][j];if(v==A[i][j+1]&&v==A[i+1][j]&&v==A[i+1][j+1])s+=3}
    const pat=[1,0,1,1,1,0,1,0,0,0,0],pr=pat.slice().reverse();
    const chk=(get)=>{for(let i=0;i<n;i++)for(let j=0;j<=n-11;j++){let a=true,b=true;for(let k=0;k<11;k++){const v=get(i,j+k);if(v!=pat[k])a=false;if(v!=pr[k])b=false}if(a||b)s+=40}};
    chk((i,j)=>A[i][j]);chk((i,j)=>A[j][i]);
    let dk=0;A.forEach(r=>r.forEach(v=>dk+=v));s+=Math.floor(Math.abs(dk*100/(n*n)-50)/5)*10;return s};
  let best=null,bs=1e9;for(let m=0;m<8;m++){const A=build(m),p=pen(A);if(p<bs){bs=p;best=A}}
  return best;
}

}

  const ed=e.target.closest("[data-ed]");if(ed){productForm(prods.find(p=>p.id===ed.dataset.ed));return}
  const sk=e.target.closest("[data-sk]");if(sk){const p=prods.find(x=>x.id===sk.dataset.sk);try{await api("/m/product/stock",{method:"POST",body:JSON.stringify({id:p.id,stock:!p.stock})});await loadProds();draw()}catch(err){toast("⚠️ "+err.message)}return}
  const dl=e.target.closest("[data-del]");if(dl){if(confirm("حذف هذا المنتج نهائياً؟")){try{await api("/m/product/delete",{method:"POST",body:JSON.stringify({id:dl.dataset.del})});await loadProds();draw();toast("تم الحذف")}catch(err){toast("⚠️ "+err.message)}}return}
  const sv=e.target.closest("#p-save");if(sv){
    if(!$("#p-cat").value){alert("اختر القسم أولاً");return}
    const b={id:sv.dataset.id||undefined,title:$("#p-title").value,price:$("#p-price").value,cur:$("#p-cur").value,old:$("#p-old").value,price_yer:$("#p-yer").value,cat:$("#p-cat").value,desc:$("#p-desc").value,stock:$("#p-stock").checked,imgs:pimgs,opts:popts.filter(g=>g.name.trim()&&g.values.length)};
    if(upl){$("#p-msg").textContent="انتظر اكتمال رفع الصور";return}
    sv.disabled=true;try{await api("/m/product",{method:"POST",body:JSON.stringify(b)});closeSheet();await loadProds();draw();toast("✅ تم حفظ المنتج")}catch(err){$("#p-msg").textContent=err.message}sv.disabled=false;return}
  const pr=e.target.closest("[data-print]");if(pr){const o=orders.find(x=>x.id===Number(pr.dataset.print));if(o){const inp=$(`[data-ship="${o.id}"]`);printLabel({...o,ship_info:inp?inp.value:o.ship_info},{platform:SHOP,name:ME.name,city:ME.city})}return}
  const s=e.target.closest("[data-st]");if(s){
    const id=Number(s.dataset.id),inp=$(`[data-ship="${id}"]`);
    try{await api("/m/order/status",{method:"POST",body:JSON.stringify({id,status:s.dataset.st,ship_info:inp?inp.value:undefined})});toast("تم التحديث ✓");await loadOrders(true,true);draw()}catch(err){toast("⚠️ "+err.message)}return}
});
document.addEventListener("click",e=>{const t=e.target.closest("[data-th]");if(!t)return;const m=t.dataset.th;try{localStorage.setItem("hs_theme",m)}catch(x){}const d=m==="dark"||(m==="auto"&&matchMedia("(prefers-color-scheme: dark)").matches);document.documentElement.dataset.theme=d?"dark":"light";draw()});
async function boot(){
  await loadMeta();
  if(!TK){if(/#reg/.test(location.hash))mode="reg";authView();if(mode==="reg"){try{const A=JSON.parse(localStorage.getItem("hs_acct")||"null");if(A){if($("#r-phone")&&!$("#r-phone").value)$("#r-phone").value=A.phone||"";if($("#r-owner")&&!$("#r-owner").value)$("#r-owner").value=A.name||""}}catch(e){}}return}
  try{ME=(await api("/m/me")).merchant}catch(e){return}
  await loadOrders();draw();
  clearInterval(timer);
  timer=setInterval(async()=>{if(document.hidden||!TK||tab!=="orders"||$("#sheet").classList.contains("show")||document.activeElement&&document.activeElement.tagName==="INPUT")return;await loadOrders(true,true);draw()},30000);
}
boot();
</script>
</body>
