<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>طلبات وفر</title>

<link rel="apple-touch-icon" href="apple-touch-icon.png?v=4">

<meta name="mobile-web-app-capable" content="yes">

<style>
:root{--deep:#241406;--brown:#3a2210;--gold:#f0b13a;--gold2:#ffd27a;--bg:#f6efe4;--ink:#241406;--muted:#8a7a68;--line:#eadfce;--card:#fff;
--new:#d92d20;--prep:#d98a06;--ship:#2563eb;--done:#12803c;--cancel:#8a7a68}
@media (prefers-color-scheme:dark){:root{--bg:#171009;--ink:#f6efe4;--muted:#b3a28c;--line:#3a2a1a;--card:#241709}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Tajawal","Segoe UI",Tahoma,sans-serif}
button{font-family:inherit;cursor:pointer;border:0;color:inherit;background:none}
input{font-family:inherit}
.wrap{max-width:760px;margin:0 auto;padding:0 12px 90px}
header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,var(--deep),var(--brown));color:#fff;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;box-shadow:0 4px 14px rgba(0,0,0,.3)}
header .in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px}
header h1{margin:0;font-size:19px;font-weight:900;color:var(--gold2);flex:1}
header .rf{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.12);font-size:18px;color:#fff}
header .rf.spin{animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin:12px 0 8px}
.st{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:7px 1px;text-align:center;font-weight:800;font-size:10.5px;color:var(--muted);box-shadow:0 2px 8px rgba(36,20,6,.06)}
.st b{display:block;font-size:19px;font-weight:900;line-height:1.1;color:var(--ink)}
.st.on{outline:2.5px solid var(--gold);background:linear-gradient(180deg,#fff7e3,var(--card))}
.st i{display:block;width:22px;height:4px;border-radius:4px;margin:0 auto 4px}
.today{display:flex;justify-content:space-between;gap:8px;background:linear-gradient(110deg,#1c0f04,#4a2b12);color:#fff;border-radius:14px;padding:10px 14px;font-weight:800;font-size:13.5px;margin-bottom:10px}
.today b{color:var(--gold2)}
.search{display:flex;gap:8px;margin-bottom:10px}
.search input{flex:1;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:11px 12px;font-size:15px;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:10px;box-shadow:0 2px 10px rgba(36,20,6,.07);overflow:hidden;border-right:5px solid var(--c,var(--line))}
.card.sel{outline:2.5px solid var(--gold)}
.hd{display:flex;align-items:center;gap:8px;padding:10px 12px 4px}
.hd .ck{width:22px;height:22px;accent-color:#c98a1a}
.hd .id{font-weight:900;font-size:17px}
.badge{margin-right:auto;color:#fff;background:var(--c);border-radius:999px;padding:3px 11px;font-size:12px;font-weight:900}
.tm{color:var(--muted);font-size:12px;font-weight:700;padding:0 12px}
.bd{padding:6px 12px 8px;font-size:14px;line-height:1.7}
.bd .nm{font-weight:900;font-size:15.5px}
.bd .ad{color:var(--muted);font-weight:700}
.its{margin:6px 0;border-top:1px dashed var(--line);border-bottom:1px dashed var(--line);padding:5px 0;font-size:13.5px}
.its .it{color:inherit;text-decoration:none;display:flex;align-items:center;gap:10px;padding:5px 0}
.its img,.its .ph{width:54px;height:54px;border-radius:10px;object-fit:cover;background:var(--bg);flex:0 0 auto;display:grid;place-items:center;font-size:22px}
.its .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.its .tx b{font-size:13.5px;line-height:1.35}
.its small{color:var(--muted);font-weight:700;font-size:12px}
.its .sub{font-weight:900;font-size:13px;white-space:nowrap}
.tot{display:flex;justify-content:space-between;font-weight:900;font-size:16px}
.tot b{color:var(--new)}
.note{background:#fff7e3;color:#6b4a10;border-radius:8px;padding:5px 9px;margin-top:6px;font-size:13px;font-weight:700}
.act{display:flex;flex-wrap:wrap;gap:6px;padding:4px 12px 12px}
.act button,.act a{flex:1 1 auto;text-align:center;text-decoration:none;border-radius:10px;padding:9px 8px;font-weight:900;font-size:13px;background:var(--bg);border:1px solid var(--line);color:var(--ink);white-space:nowrap}
.act .prt{flex-basis:100%;background:var(--deep);border-color:#111;color:var(--gold2)}
.act .wa{background:#25d366;border-color:#25d366;color:#fff;flex-basis:100%}
.act .go{background:var(--c);border-color:var(--c);color:#fff}
.act .cur{opacity:.45;pointer-events:none}
.more{display:block;margin:6px auto 20px;background:var(--brown);color:var(--gold2);font-weight:900;border-radius:12px;padding:11px 28px}
.empty{text-align:center;color:var(--muted);font-weight:700;padding:40px 10px}
.bulk{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--deep);color:#fff;padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:none;box-shadow:0 -6px 20px rgba(0,0,0,.35)}
.bulk.show{display:block}
.bulk .in{max-width:760px;margin:0 auto}
.bulk .t{font-weight:900;margin-bottom:6px;font-size:13.5px;display:flex;justify-content:space-between}
.bulk .r{display:flex;gap:6px}
.bulk .r button{flex:1;border-radius:10px;padding:10px 4px;font-weight:900;font-size:12.5px;color:#fff;background:var(--c)}
.login{max-width:420px;margin:12vh auto 0;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 18px;box-shadow:0 8px 30px rgba(36,20,6,.15)}
.login h2{margin:0 0 4px;font-size:22px}
.login p{margin:0 0 14px;color:var(--muted);font-weight:700;font-size:13.5px}
.login label{display:block;font-weight:800;font-size:13px;margin:10px 0 4px}
.login input{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:11px;font-size:15px}
.login .go{width:100%;margin-top:16px;background:linear-gradient(180deg,var(--gold2),var(--gold));color:#111;font-weight:900;font-size:16px;border-radius:12px;padding:13px}
.err{color:var(--new);font-weight:800;font-size:13px;margin-top:10px;min-height:18px}
.pnav{position:fixed;left:0;right:0;bottom:0;z-index:35;background:linear-gradient(180deg,var(--brown),var(--deep));padding:6px 6px calc(6px + env(safe-area-inset-bottom));display:flex;gap:3px;border-radius:18px 18px 0 0;box-shadow:0 -6px 20px rgba(0,0,0,.3)}
.pnav button{flex:1;min-width:0;position:relative;display:flex;flex-direction:column;align-items:center;gap:0;font-size:10px;font-weight:800;color:#d9c7ad;padding:6px 0;border-radius:12px}
.pnav button b{font-size:18px;line-height:1.25}
.pnav button.on{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#111}
.pnav .nb{position:absolute;top:0;left:14%;background:var(--new);color:#fff;font-size:10px;min-width:16px;height:16px;border-radius:99px;display:grid;place-items:center;padding:0 4px}
.bulk{bottom:calc(58px + env(safe-area-inset-bottom))!important}
.pc{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:10px;padding:12px;box-shadow:0 2px 10px rgba(36,20,6,.07);font-size:14px;line-height:1.7}
.pc h3{margin:0 0 2px;font-size:16px}.pc .sub{color:var(--muted);font-weight:700;font-size:13px}
.pc .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.pc .row button,.pc .row a{flex:1 1 auto;text-align:center;text-decoration:none;border-radius:10px;padding:9px 8px;font-weight:900;font-size:13px;background:var(--bg);border:1px solid var(--line);color:var(--ink)}
.pc .row .ok{background:#12803c;border-color:#12803c;color:#fff}.pc .row .no{background:#d92d20;border-color:#d92d20;color:#fff}.pc .row .gd{background:var(--deep);border-color:#111;color:var(--gold2)}
.pc .bank{background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:6px 10px;margin-top:6px;font-weight:800;font-size:13px}
.pc .bank b{direction:ltr;unicode-bidi:plaintext;font-size:15px}
.pc .big{font-size:20px;font-weight:900;color:#12803c}
.pc img.rc{width:100%;max-height:300px;object-fit:contain;background:#000;border-radius:10px;margin:6px 0}
.pc .tag{display:inline-block;border-radius:999px;padding:2px 10px;font-size:11.5px;font-weight:900;color:#fff;background:var(--cancel)}
.pc .tag.active{background:var(--done)}.pc .tag.pending{background:var(--prep)}
.pc .warn{background:#fff1f0;color:#b3261e;border-radius:8px;padding:5px 9px;margin-top:6px;font-weight:800;font-size:13px}
.pr{display:flex;gap:10px;align-items:center}.pr img,.pr .ph{width:64px;height:64px;border-radius:12px;object-fit:cover;background:var(--bg);flex:none;display:grid;place-items:center;font-size:24px}
.pr .t{flex:1;min-width:0}.pr .t b{display:block;font-size:14px;line-height:1.35}
.seg{display:flex;gap:6px;margin:12px 0 8px}.seg button{flex:1;padding:10px;border-radius:12px;font-weight:900;font-size:13.5px;background:var(--card);border:1px solid var(--line)}.seg button.on{background:var(--deep);color:var(--gold2);border-color:#111}
.sheetbg{position:fixed;inset:0;background:#0007;z-index:80;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:16px 14px calc(16px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
.sheet label{display:block;font-weight:800;font-size:13px;margin:10px 0 4px}.sheet input,.sheet select{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:11px;font-size:15px;font-family:inherit}
.sheet .go{width:100%;margin-top:14px;background:linear-gradient(180deg,var(--gold2),var(--gold));color:#111;font-weight:900;border-radius:12px;padding:12px}
.cin{width:70px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:6px;text-align:center;font-weight:900}
.bell{position:relative;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.12);font-size:17px;color:#fff}
.bell .nb2{position:absolute;top:-3px;left:-3px;background:var(--new);color:#fff;font-size:10.5px;min-width:17px;height:17px;border-radius:99px;display:none;place-items:center;padding:0 4px;font-weight:900}
.bell.has .nb2{display:grid}.bell.has{animation:rg 1.6s ease-in-out infinite}@keyframes rg{0%,100%{transform:rotate(0)}10%{transform:rotate(14deg)}20%{transform:rotate(-12deg)}30%{transform:rotate(8deg)}40%{transform:rotate(0)}}
.alr{display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:8px;font-weight:800;width:100%;text-align:right;font-size:14px}
.alr b{margin-right:auto;background:var(--new);color:#fff;border-radius:99px;padding:1px 9px;font-size:13px}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--deep);color:var(--gold2);padding:9px 18px;border-radius:999px;font-weight:800;font-size:14px;z-index:90;opacity:0;pointer-events:none;transition:.3s}
.toast.show{opacity:1}

/* ===== الثيم الجديد: أبيض + أصفر + أسود ===== */
:root,:root:not([data-x]){--deep:#ffd500;--brown:#ffd500;--gold:#ffd500;--gold2:#111;--bg:#f6f6f6;--ink:#111;--muted:#6b6b6b;--line:#ececec;--card:#fff;--hot:#e5281c;--sh:0 1px 4px rgba(0,0,0,.07)}
@media (prefers-color-scheme:dark){:root,:root:not([data-x]){--deep:#ffd500;--brown:#ffd500;--gold:#ffd500;--gold2:#111;--bg:#f6f6f6;--ink:#111;--muted:#6b6b6b;--line:#ececec;--card:#fff}}
html,body{background:#f6f6f6;color:#111}
header{background:#fff!important;color:#111!important;box-shadow:0 1px 0 #ececec!important}
header h1{color:#111!important}
header a{background:#f2f2f2!important;color:#111!important}
header .rf,header button{background:#f2f2f2!important;color:#111!important}
.btn.gold,.go,.fab,.sheet .go,.login .go{background:var(--gold)!important;color:#111!important;box-shadow:none!important}
.card,.pl,.st,.auth,.login,.sheet,.sheet .in{box-shadow:none}
.card,.pl,.st{border-color:#ececec}
.st.on{outline-color:#111;background:#fff8cc}
.today{background:#ffd500!important;color:#111!important}
.nav,.pnav{background:#fff!important;border-top:1px solid #ececec;border-radius:0!important;box-shadow:0 -2px 12px rgba(0,0,0,.06)!important}
.nav button,.pnav button{color:#111!important}
.nav .tolink{color:#111!important;border-color:#111!important}
.nav button.on,.pnav button.on{background:var(--gold)!important;color:#111!important}
.chip.on,.tab.on,.on.pill{background:var(--gold);color:#111;border-color:var(--gold)}
@media (min-width:900px){
  body{padding-bottom:90px}
  .wrap{max-width:1100px!important;padding-left:24px!important;padding-right:24px!important}
  header .in{max-width:1100px!important}
  .nav,.pnav{left:50%!important;right:auto!important;transform:translateX(-50%);width:640px;bottom:14px!important;border:1px solid #ececec;border-radius:18px!important;box-shadow:0 8px 28px rgba(0,0,0,.15)!important}
  .nav button,.pnav button{font-size:13px!important}
  .fab{left:calc(50% - 550px)!important;bottom:92px!important}
  .sheet,.sheet .in{max-width:720px!important}
  .sheet{border-radius:20px!important}
  .sheetbg,.sh{align-items:center}
}

@media (min-width:900px){
  .stats{grid-template-columns:repeat(6,1fr);gap:10px}
  .st{font-size:13px;padding:12px 4px}.st b{font-size:26px}
}
*{border-radius:0!important}
.act .go,.act .prt,.act button,.act a{background:#fff!important;color:#111!important;border:1px solid #cfcfcf!important}
.act .wa{background:#25d366!important;color:#fff!important;border-color:#25d366!important}
.act .go:active,.act .prt:active,.act button:active,.act .cur{background:#12803c!important;color:#fff!important;border-color:#12803c!important;opacity:1!important}
.act .go{border-color:var(--c)!important}
.pc .row .gd,.gd,.btn.gold,.fab,.sheet .go,.login .go,.nav button.on,.pnav button.on,.st.on{border-color:transparent!important}
.pc .row .gd,.btn.gold,.sheet .go,.login .go{border:0!important}
.fab{border:0!important}
.slist{margin:8px 0}.so{border:1px solid #ececec;padding:8px 10px;margin-bottom:6px;background:#fafafa}.so.held{opacity:.65;background:#fff1f0}
.soh{display:flex;justify-content:space-between;margin-bottom:4px}.si{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:2px 0}.si small{color:#777}
.sn{display:flex;justify-content:space-between;gap:8px;border-top:1px dashed #ddd;margin-top:4px;padding-top:4px;font-size:13px}.sn b{color:#12803c}
html[data-theme=dark]{filter:invert(1) hue-rotate(180deg);background:#fff}
html[data-theme=dark] img,html[data-theme=dark] video,html[data-theme=dark] .wlc .ph,html[data-theme=dark] .slide .im{filter:invert(1) hue-rotate(180deg)}
html[data-theme=dark] .addw,html[data-theme=dark] .nav button.on,html[data-theme=dark] .dnav .on,html[data-theme=dark] .chip.on,html[data-theme=dark] .btn.cart,html[data-theme=dark] .av2,html[data-theme=dark] .role,html[data-theme=dark] .upl,html[data-theme=dark] .seg2 button.on,html[data-theme=dark] .seg3 button.on,html[data-theme=dark] .rbtn,html[data-theme=dark] .rgo,html[data-theme=dark] .av button,html[data-theme=dark] .fab,html[data-theme=dark] .go,html[data-theme=dark] .btn.gold,html[data-theme=dark] .slide,html[data-theme=dark] .pnav button.on,html[data-theme=dark] .tag,html[data-theme=dark] .dp,html[data-theme=dark] .cnt,html[data-theme=dark] .nb{filter:invert(1) hue-rotate(180deg)}
.cth{margin-top:8px;display:flex;flex-direction:column;gap:6px;max-height:300px;overflow-y:auto}
.cm{max-width:82%;padding:7px 10px;font-size:13.5px;line-height:1.6}.cm small{display:block;color:#888;font-size:10.5px}
.cm.c{align-self:flex-start;background:#f2f2f2}.cm.a{align-self:flex-end;background:#ffd500}.cm.a.ai{background:#eee}

/* ===== الشكل الجديد (وفر) ===== */
header{background:linear-gradient(180deg,#ffd500,#ffe55c)!important;color:#111!important;box-shadow:0 2px 10px rgba(0,0,0,.1)!important;border:0!important}
header h1{color:#111!important}
header .rf,header .bell{background:#111!important;color:#ffd500!important}
header .hlg{height:42px;width:auto;margin:-4px 0;flex:none}
.nav,.pnav{background:#fff!important;border-radius:28px!important;box-shadow:0 8px 28px rgba(0,0,0,.18)!important;border:0!important;left:10px!important;right:10px!important;bottom:calc(8px + env(safe-area-inset-bottom))!important}
.nav button,.pnav button,.nav .tolink{color:#111!important}
.st.on{outline-color:#ffd500}
@media(min-width:900px){
header .in{max-width:1700px!important;padding:0 24px}
.wrap{max-width:1700px!important;padding-left:24px!important;padding-right:24px!important}
.wrap:has(>.card),.wrap:has(>.pc){display:grid;grid-template-columns:repeat(auto-fill,minmax(440px,1fr));gap:14px;align-items:start}
.wrap:has(>.card)>*,.wrap:has(>.pc)>*{margin-bottom:0}
.wrap:has(>.card)>:not(.card),.wrap:has(>.pc)>:not(.pc){grid-column:1/-1}
.nav,.pnav{left:50%!important;right:auto!important;width:760px!important}
.stats{gap:10px}.st{padding:12px 4px;font-size:13px}.st b{font-size:26px}
}
.pnav{overflow-x:auto;justify-content:flex-start!important;scrollbar-width:none}.pnav::-webkit-scrollbar{display:none}.pnav button{flex:0 0 auto!important;min-width:62px!important;padding-left:4px!important;padding-right:4px!important}

/* ===== لوحة الإدارة — الشكل الجديد (إطار + بطاقات) ===== */
.shell{display:block}
.sb{display:none}
.tb{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;background:linear-gradient(180deg,#ffd500,#ffe55c);padding:calc(10px + env(safe-area-inset-top)) 14px 10px;box-shadow:0 2px 10px rgba(0,0,0,.1)}
.tb .hlg{height:40px;width:auto;flex:none}
.tb h1{margin:0;font-size:19px;font-weight:900;flex:1;display:flex;align-items:center;gap:8px;color:#111}
.tb .tic{width:34px;height:34px;display:grid;place-items:center;background:#fff8;font-size:18px}
.tb .tba{display:flex;gap:8px}
.tb .rf,.tb .bell{width:40px;height:40px;background:#111!important;color:#ffd500!important;font-size:18px;position:relative}
.tb .rf.spin{animation:sp .8s linear infinite}
.shell .tb .rf,.shell .tb .bell,.shell .tb .tic{border-radius:12px!important}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 10px}
.kpi{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);padding:10px 12px;text-align:right;min-width:0}
.kpi .ki{width:38px;height:38px;display:grid;place-items:center;font-size:19px;flex:none;background:color-mix(in srgb,var(--c,#ffd500) 18%,#fff)}
.kpi .kt{display:block;font-size:12px;font-weight:800;color:var(--muted);line-height:1.3}
.kpi b{display:block;font-size:22px;font-weight:900;line-height:1.15;color:#111}
.kpi.on{outline:2.5px solid #ffd500;background:#fffbe0}
.shell .kpi,.shell .kpi .ki{border-radius:16px!important}.shell .kpi .ki{border-radius:12px!important}
.kpi small{display:block;font-size:11px;font-weight:700;color:var(--muted)}
.hgrid{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:12px}
.pan{background:#fff;border:1px solid var(--line);padding:14px;min-width:0}
.shell .pan,.shell .otb,.shell .today{border-radius:16px!important}
.pan h2{margin:0 0 10px;font-size:15.5px;font-weight:900;display:flex;align-items:center;gap:8px}

{const mk=location.hash.match(/[#&]k=([A-Za-z0-9]{24,40})/);if(mk){KEY=mk[1];LS.set("ho_key",KEY);try{history.replaceState(null,"",location.pathname)}catch(e){}}}

  const f=e.target.closest("[data-f]");if(f){filter=f.dataset.f;q="";sel.clear();load(true);return}
  if(e.target.closest("#rf")){load(true);return}

  const b=e.target.closest("[data-bulk]");if(b){if(confirm(`تغيير حالة ${sel.size} طلب إلى «${ST[b.dataset.bulk][0]}»؟`))setStatus([...sel],b.dataset.bulk);return}

function askText(title,hint,min){return new Promise(res=>{
  if(!document.getElementById("ask-css")){const st=document.createElement("style");st.id="ask-css";st.textContent=".ask-bg{position:fixed;inset:0;background:#0008;z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px}.ask{background:var(--card,#fff);color:var(--ink,#222);width:100%;max-width:420px;border-radius:18px;padding:18px;font-family:inherit;box-shadow:0 10px 40px #0005}.ask h3{margin:0 0 6px;font-size:17px}.ask p{margin:0 0 10px;font-size:13px;color:var(--muted,#777)}.ask textarea{width:100%;border:1px solid var(--line,#ddd);background:var(--bg,#f7f7f7);color:inherit;border-radius:12px;padding:11px;font-size:15px;font-family:inherit;resize:none;box-sizing:border-box}.ask-err{color:#c0392b;font-size:12.5px;font-weight:700;min-height:18px;margin-top:4px}.ask-b{display:flex;gap:8px;margin-top:8px}.ask-b button{flex:1;border:0;border-radius:12px;padding:12px;font-family:inherit;font-weight:800;font-size:15px;cursor:pointer}.ask-b .ok{background:#ffd500;color:#111}.ask-b .cn{background:var(--bg,#eee);color:inherit}";document.head.appendChild(st)}
  const bg=document.createElement("div");bg.className="ask-bg";

  document.body.appendChild(bg);const ta=bg.querySelector("textarea");setTimeout(()=>ta.focus(),50);
  const done=v=>{bg.remove();res(v)};
  bg.querySelector(".cn").onclick=()=>done(null);
  bg.querySelector(".ok").onclick=()=>{const v=ta.value.trim();if(v.length<min){bg.querySelector(".ask-err").textContent=min>3?"اكتب وصفاً أوضح للمشكلة":"اكتب السبب ليصل للعميل";return}done(v)};

})}
function pickImgFit(file,maxW){return new Promise((res,rej)=>{const im=new Image(),u=URL.createObjectURL(file);im.onload=()=>{URL.revokeObjectURL(u);let w=Math.min(maxW,im.width),q=.86;for(let t=0;t<6;t++){const h=Math.round(im.height*w/im.width),c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);const d=c.toDataURL("image/jpeg",q);if(d.length<820000||t===5){res(d);return}q=Math.max(.6,q-.08);w=Math.round(w*.88)}};im.onerror=()=>rej(new Error("تعذّر قراءة الصورة"));im.src=u})}
function pickImg(file,w,h){return new Promise((res,rej)=>{const im=new Image(),u=URL.createObjectURL(file);im.onload=()=>{const c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,w,h);const k=Math.max(w/im.width,h/im.height),dw=im.width*k,dh=im.height*k;x.drawImage(im,(w-dw)/2,(h-dh)/2,dw,dh);URL.revokeObjectURL(u);res(c.toDataURL("image/jpeg",.85))};im.onerror=()=>rej(new Error("تعذّر قراءة الصورة"));im.src=u})}

function lineSvg(vals,labs){

  const area=line+` L${x(n-1).toFixed(1)} ${H-B} L${x(0).toFixed(1)} ${H-B} Z`;
  let g="";for(let k=0;k<=3;k++){const v=Math.round(mx*k/3),yy=y(mx*k/3);g+=`<line x1="${PL}" x2="${W-PR}" y1="${yy}" y2="${yy}" stroke="#eee"/><text x="${PL-6}" y="${yy+4}" font-size="12" fill="#999" text-anchor="end">${v}</text>`}
  const xl=labs.map((l,i)=>`<text x="${x(i)}" y="${H-8}" font-size="12" fill="#888" text-anchor="middle">${l}</text>`).join("");
  return `<svg class="lc" viewBox="0 0 ${W} ${H}" role="img" aria-label="الطلبات آخر 7 أيام"><defs><linearGradient id="lg1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd500" stop-opacity=".45"/><stop offset="1" stop-color="#ffd500" stop-opacity="0"/></linearGradient></defs>${g}<path d="${area}" fill="url(#lg1)"/><path d="${line}" fill="none" stroke="#e0b400" stroke-width="2.5" stroke-linejoin="round"/>${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.6" fill="#fff" stroke="#e0b400" stroke-width="2"><title>${vals[i]} طلب</title></circle>`).join("")}${xl}</svg>`;
}

function drawPage(){
  const t=PAGES.find(x=>x[0]===page);

  $("#app").innerHTML=`<div class="shell">${side()}<main class="mn">${topbar([t[1],t[2]],false,"rfp")}<div class="wrap">${pageBody()}</div></main></div>`;
  const fq=$("#fq");if(fq){fq.oninput=e=>{fsset("q",e.target.value.trim());clearTimeout(drawPage._f);drawPage._f=setTimeout(()=>{drawPage();const i=$("#fq");if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}},250)};if(keepF){fq.focus();fq.setSelectionRange(fq.value.length,fq.value.length)}}

}

  if(b=e.target.closest("[data-cpadd]")){couponForm();return}
  if(b=e.target.closest("[data-cpedit]")){const c=((D.coupons||{}).coupons||[]).find(x=>x.id===Number(b.dataset.cpedit));if(c)couponForm(c);return}

  if(b=e.target.closest("[data-cpdel]")){const id=Number(b.dataset.cpdel);if(confirm("حذف هذا الكوبون؟"))act("/api/coupon",{id,del:1},"تم الحذف");return}
  if(b=e.target.closest("[data-asearch]")){auditQ=($("#aq")||{}).value||"";auditLim=40;loadPage();return}
  if(b=e.target.closest("[data-amore]")){auditLim+=40;loadPage();return}
  if(b=e.target.closest("[data-ckey]")){const id=Number(b.dataset.ckey);if(!confirm("إنشاء رابط جديد سيُلغي الرابط القديم لهذا المركز. متابعة؟"))return;try{const j=await api("/api/center-key",{method:"POST",body:JSON.stringify({id})});const link=new URL("center.html",location.href).href+"#k="+j.key;const bg=document.createElement("div");bg.className="sheetbg";bg.innerHTML=`<div class="sheet"><h3>🔑 رابط موظفي المركز</h3><p style="font-size:13px;color:#666">أرسله لموظف المركز فقط (واتساب). يفتح له لوحة استلام وتسليم الطرود. أي رابط جديد يلغي القديم.</p><input readonly value="${link}" style="width:100%;direction:ltr;padding:10px;border:1px solid #ddd;border-radius:10px;font-size:12px"><div class="row" style="margin-top:10px"><button id="kc">📋 نسخ</button><button id="kx">إغلاق</button></div></div>`;document.body.appendChild(bg);bg.querySelector("#kx").onclick=()=>bg.remove();bg.querySelector("#kc").onclick=async()=>{try{await navigator.clipboard.writeText(link);toast("تم النسخ ✓")}catch{bg.querySelector("input").select()}}}catch(err){toast("⚠️ "+err.message)}return}

/* ================= التنبيهات ================= */
let AL=null, alPrev=null, swReg=null;
const alTotal=a=>a?(a.merchants+a.payments+a.complaints.length+a.newOrders):0;
function paintBell(){
  const b=$("#bell");if(b){const n=AL?(AL.merchants+AL.payments+AL.complaints.length+(AL.chats||0)):0,s=b.querySelector(".nb2");b.classList.toggle("has",n>0);if(s)s.textContent=n}
  const n=AL?(AL.merchants+AL.payments+AL.complaints.length+(AL.chats||0)):0;document.title=(n?`(${n}) `:"")+"طلبات وفر";
}
async function pollAlerts(){
  if(!KEY)return;
  try{
    const a=await api("/api/alerts");
    if(alPrev){
      const more=a.merchants>alPrev.merchants?"🏪 تاجر جديد بانتظار الموافقة":a.payments>alPrev.payments?"💳 إيصال دفع جديد للمراجعة":(a.chats||0)>(alPrev.chats||0)?"💬 رسالة جديدة من عميل":a.complaints.length>alPrev.complaints.length?"⚠️ عميل أبلغ أنه لم يستلم طلبه":a.newOrders>alPrev.newOrders?"🆕 طلب جديد وصل":"";
      if(more){beep();toast(more);try{navigator.vibrate&&navigator.vibrate(200)}catch{}
        if(document.hidden&&"Notification" in window&&Notification.permission==="granted"){try{new Notification("وفر — الإدارة",{body:more,icon:"icon-192.png",tag:"hs-admin"})}catch{}}
        if(page!=="orders")loadBadges()}
    }
    alPrev=a;AL=a;paintBell();
  }catch(e){}
}
function b64uToArr(s){s=s.replace(/-/g,"+").replace(/_/g,"/");const p="=".repeat((4-s.length%4)%4),r=atob(s+p);return Uint8Array.from(r,c=>c.charCodeAt(0))}
async function enablePush(){
  if(!("serviceWorker" in navigator)||!("PushManager" in window))return toast("جوالك لا يدعم الإشعارات هنا (على الآيفون أضف اللوحة للشاشة الرئيسية أولاً)");
  const perm=await Notification.requestPermission();if(perm!=="granted")return toast("لم يتم السماح بالإشعارات");
  try{
    const reg=swReg||await navigator.serviceWorker.register("sw.js");await navigator.serviceWorker.ready;
    const {key}=await api("/api/vapid");
    const sub=(await reg.pushManager.getSubscription())||await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64uToArr(key)});
    await api("/api/push/sub",{method:"POST",body:JSON.stringify({subscription:sub.toJSON()})});
    LS.set("ho_push","1");toast("✅ تم تفعيل إشعارات الجوال");closeAlerts();
  }catch(e){toast("⚠️ تعذّر التفعيل: "+e.message)}
}
function closeAlerts(){document.querySelectorAll(".sheetbg").forEach(x=>x.remove())}
function alertsSheet(){
  const a=AL||{merchants:0,payments:0,complaints:[],newOrders:0,settle:0};
  const rows=[["merch",`🏪 تجار جدد بانتظار الموافقة`,a.merchants],["pay",`💳 إيصالات دفع للمراجعة`,a.payments],["settle",`💼 تجار مستحقاتهم جاهزة للتحويل`,a.settle],["orders",`🆕 طلبات جديدة`,a.newOrders]].filter(r=>r[2]);
  const bg=document.createElement("div");bg.className="sheetbg";
  bg.innerHTML=`<div class="sheet"><h3 style="margin:0 0 10px">🔔 التنبيهات</h3>
  ${rows.map(([k,l,n])=>`<button class="alr" data-goto="${k}">${l}<b>${n}</b></button>`).join("")}
  ${a.complaints.length?`<button class="alr" data-goto="cmp" style="border-color:var(--new)">⚠️ عميل أبلغ بعدم الاستلام: ${a.complaints.map(i=>"#"+i).join("، ")}<b>${a.complaints.length}</b></button>`:""}
  ${!rows.length&&!a.complaints.length?`<div class="empty" style="padding:18px">لا توجد تنبيهات الآن ✅</div>`:""}
  <button class="go" id="al-push" style="${LS.get("ho_push","")?"opacity:.6":""}">${LS.get("ho_push","")?"✅ إشعارات الجوال مفعّلة (اضغط لإعادة التفعيل)":"🔔 تفعيل إشعارات الجوال"}</button>
  <div style="color:var(--muted);font-size:12px;font-weight:700;margin-top:8px;line-height:1.6">الإشعارات تصل لجوالك حتى والتطبيق مغلق (تاجر جديد، إيصال دفع، عميل لم يستلم). على الآيفون يجب أولاً إضافة اللوحة إلى الشاشة الرئيسية.</div>
  <button class="go" style="background:var(--bg);color:var(--ink);margin-top:8px" id="al-x">إغلاق</button></div>`;
  document.body.appendChild(bg);
  bg.onclick=e=>{if(e.target===bg)bg.remove()};
  bg.querySelector("#al-x").onclick=()=>bg.remove();
  bg.querySelector("#al-push").onclick=enablePush;
  bg.querySelectorAll("[data-goto]").forEach(b=>b.onclick=()=>{const k=b.dataset.goto;bg.remove();if(k==="cmp"){q=String(a.complaints[0]);filter="new";curMid=null;setPage("orders");return}if(k==="orders"){filter="new";curMid=null;q=""}setPage(k)});
}
document.addEventListener("click",e=>{if(e.target.closest("#bell")){pollAlerts().then(alertsSheet)}});
async function boot(){
  if(!KEY)return loginView();
  clearInterval(timer);
  await loadProds();
  try{if("serviceWorker" in navigator)swReg=await navigator.serviceWorker.register("sw.js")}catch(e){}
  drawNav();
  if(page==="orders")await load(true);else{drawPage();await loadPage()}
  loadBadges();pollAlerts();clearInterval(boot._al);boot._al=setInterval(()=>{if(KEY)pollAlerts()},20000);
  timer=setInterval(()=>{if(document.hidden||!KEY)return;if(page==="orders"){if(!sel.size)load(true,true);loadBadges()}else if(!document.querySelector(".sheetbg"))loadPage(true)},30000);
}
boot();
</script>
